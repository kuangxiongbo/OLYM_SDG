<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>控制台原型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="navbar">
    <div class="brand">AI 数据平台</div>
    <div class="menu">
      <span style="color: var(--primary); font-weight: 600;">首页</span>
      <span>任务中心</span>
      <span>系统设置</span>
    </div>
    <div class="menu">
      <span>管理员 · admin@app.com</span>
      <span>退出</span>
    </div>
  </div>

  <main>
    <section class="section">
      <h2>核心工具</h2>
      <div class="grid cards">
        <div class="card">
          <span class="badge">仿真数据</span>
          <h3>AI 仿真数据生成</h3>
          <p style="color: var(--muted);">通过行业模板与字段配置，快速生成符合业务场景的合成数据集。</p>
          <div class="actions">
            <button class="button primary" style="width: 100%;">立即进入</button>
          </div>
        </div>
        <div class="card">
          <span class="badge">质量评估</span>
          <h3>AI 数据质量评估</h3>
          <p style="color: var(--muted);">对比原始与仿真数据，多维度检查相似度、缺失率、异常值等。</p>
          <div class="actions">
            <button class="button primary" style="width: 100%;">立即进入</button>
          </div>
        </div>
        <div class="card">
          <span class="badge">数据安全</span>
          <h3>AI 数据脱敏</h3>
          <p style="color: var(--muted);">自动识别敏感字段，推荐仿真或遮蔽策略，实现安全共享。</p>
          <div class="actions">
            <button class="button primary" style="width: 100%;">立即进入</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
