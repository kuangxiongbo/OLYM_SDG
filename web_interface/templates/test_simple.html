<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单测试页面 - 数据生成</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }
        
        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #495057;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #dee2e6;
        }
        
        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f0ff;
        }
        
        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8e8ff;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
        }
        
        .error-box {
            background: #ffebee;
            border-left: 4px solid #f44336;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
            color: #c62828;
        }
        
        .success-box {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
            color: #2e7d32;
        }
        
        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            margin: 5px;
        }
        
        .status.pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status.running {
            background: #cfe2ff;
            color: #084298;
        }
        
        .status.completed {
            background: #d1e7dd;
            color: #0f5132;
        }
        
        .status.failed {
            background: #f8d7da;
            color: #842029;
        }
        
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e9ecef;
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }
        
        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #495057;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .log-area {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
        }
        
        .log-entry {
            margin: 5px 0;
            padding: 5px;
        }
        
        .log-entry.error {
            color: #f48771;
        }
        
        .log-entry.success {
            color: #4ec9b0;
        }
        
        .log-entry.info {
            color: #569cd6;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 简单测试页面 - 数据生成</h1>
        
        <!-- 文件上传区域 -->
        <div class="section">
            <div class="section-title">1. 上传数据文件</div>
            <div class="upload-area" id="uploadArea">
                <p style="font-size: 18px; margin-bottom: 10px;">📁 点击或拖拽文件到此处</p>
                <p style="color: #6c757d; font-size: 14px;">支持 CSV、Excel 文件</p>
                <input type="file" id="fileInput" accept=".csv,.xlsx,.xls">
            </div>
            <div id="fileInfo" class="info-box hidden">
                <strong>已选择文件：</strong><span id="fileName"></span>
                <br><strong>文件大小：</strong><span id="fileSize"></span>
            </div>
        </div>
        
        <!-- 生成配置 -->
        <div class="section">
            <div class="section-title">2. 生成配置</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div>
                    <label style="display: block; margin-bottom: 5px; font-weight: 500;">生成数量：</label>
                    <input type="number" id="dataAmount" value="100" min="10" max="10000" 
                           style="width: 100%; padding: 8px; border: 1px solid #dee2e6; border-radius: 4px;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px; font-weight: 500;">模型类型：</label>
                    <select id="modelType" style="width: 100%; padding: 8px; border: 1px solid #dee2e6; border-radius: 4px;">
                        <option value="ctgan">CTGAN</option>
                        <option value="gaussian_copula">Gaussian Copula</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- 操作按钮 -->
        <div class="section">
            <div class="section-title">3. 操作</div>
            <button class="btn" id="startBtn" onclick="startGeneration()" disabled>🚀 开始生成</button>
            <button class="btn btn-secondary" onclick="clearLogs()">🗑️ 清空日志</button>
        </div>
        
        <!-- 任务状态 -->
        <div class="section" id="taskSection" style="display: none;">
            <div class="section-title">4. 任务状态</div>
            <div>
                <strong>任务ID：</strong><span id="taskId"></span>
                <span class="status" id="taskStatus">pending</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%;">0%</div>
            </div>
            <div id="taskMessage" style="margin-top: 10px;"></div>
        </div>
        
        <!-- 结果预览 -->
        <div class="section" id="resultSection" style="display: none;">
            <div class="section-title">5. 生成结果</div>
            <div id="resultInfo"></div>
            <div style="margin-top: 15px;">
                <button class="btn" onclick="downloadResult()">📥 下载结果</button>
                <button class="btn btn-secondary" onclick="viewOriginal()">👁️ 查看原始数据</button>
            </div>
        </div>
        
        <!-- 日志区域 -->
        <div class="section">
            <div class="section-title">6. 运行日志</div>
            <div class="log-area" id="logArea">
                <div class="log-entry info">等待操作...</div>
            </div>
        </div>
    </div>
    
    <script>
        let currentFileId = null;
        let currentTaskId = null;
        let pollingInterval = null;
        
        // 文件上传
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        
        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });
        
        async function handleFileSelect(file) {
            addLog(`选择文件: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`, 'info');
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                addLog('上传文件中...', 'info');
                const response = await fetch('/api/synthesis/upload', {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });
                
                const result = await response.json();
                
                console.log('文件上传API返回:', result);  // 调试日志
                
                if (result.success) {
                    // API返回格式: { success: true, data: { file_id: ... } }
                    currentFileId = result.data?.file_id || result.file_id;
                    
                    if (!currentFileId) {
                        console.error('文件上传成功但未返回file_id:', result);
                        addLog(`❌ 错误: API返回格式异常，未找到file_id`, 'error');
                        throw new Error('文件上传成功但未返回文件ID，请检查API返回格式: ' + JSON.stringify(result));
                    }
                    
                    addLog(`✅ 文件上传成功，文件ID: ${currentFileId}`, 'success');
                    
                    document.getElementById('fileName').textContent = file.name;
                    document.getElementById('fileSize').textContent = (file.size / 1024).toFixed(2) + ' KB';
                    document.getElementById('fileInfo').classList.remove('hidden');
                    document.getElementById('startBtn').disabled = false;
                    
                    // 调试：显示当前状态
                    console.log('✅ currentFileId已设置:', currentFileId);
                    console.log('✅ 开始生成按钮已启用');
                } else {
                    throw new Error(result.error || '上传失败');
                }
            } catch (error) {
                addLog(`❌ 上传失败: ${error.message}`, 'error');
                showError('文件上传失败: ' + error.message);
            }
        }
        
        async function startGeneration() {
            // 调试：检查状态
            console.log('开始生成 - currentFileId:', currentFileId);
            console.log('开始生成 - 按钮状态:', document.getElementById('startBtn').disabled);
            
            if (!currentFileId) {
                console.error('currentFileId为空，无法开始生成');
                showError('请先上传文件（当前文件ID: ' + (currentFileId || 'null') + '）');
                addLog('❌ 错误: currentFileId为空，请重新上传文件', 'error');
                return;
            }
            
            const dataAmount = parseInt(document.getElementById('dataAmount').value) || 100;
            const modelType = document.getElementById('modelType').value;
            
            addLog('开始创建生成任务...', 'info');
            
            try {
                const response = await fetch('/api/synthesis/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        file_id: currentFileId,
                        data_amount: dataAmount,
                        model_type: modelType,
                        model_config: {},
                        fields: []  // 使用自动识别
                    })
                });
                
                const result = await response.json();
                
                console.log('生成任务API返回:', result);  // 调试日志
                
                if (result.success) {
                    // API返回格式: { success: true, data: { task_id: ... } }
                    const taskId = result.data?.task_id || result.task_id;
                    
                    if (!taskId) {
                        console.error('任务创建成功但未返回task_id:', result);
                        addLog(`❌ 错误: API返回格式异常，未找到task_id`, 'error');
                        throw new Error('任务创建成功但未返回任务ID，请检查API返回格式: ' + JSON.stringify(result));
                    }
                    
                    currentTaskId = taskId;
                    addLog(`✅ 任务创建成功，任务ID: ${currentTaskId}`, 'success');
                    
                    document.getElementById('taskId').textContent = currentTaskId;
                    document.getElementById('taskSection').style.display = 'block';
                    document.getElementById('taskStatus').textContent = 'pending';
                    document.getElementById('taskStatus').className = 'status pending';
                    document.getElementById('startBtn').disabled = true;
                    
                    // 开始轮询任务状态
                    startPolling();
                } else {
                    const errorMsg = result.error || result.data?.error || '创建任务失败';
                    console.error('任务创建失败:', errorMsg, result);
                    addLog(`❌ 创建任务失败: ${errorMsg}`, 'error');
                    throw new Error(errorMsg);
                }
            } catch (error) {
                addLog(`❌ 创建任务失败: ${error.message}`, 'error');
                showError('创建任务失败: ' + error.message);
            }
        }
        
        function startPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
            }
            
            pollingInterval = setInterval(async () => {
                try {
                    // 正确的API路径: /api/synthesis/tasks/<task_id>
                    const response = await fetch(`/api/synthesis/tasks/${currentTaskId}`, {
                        credentials: 'include',
                        headers: {
                            'Accept': 'application/json'
                        }
                    });
                    
                    // 检查响应状态
                    if (!response.ok) {
                        const text = await response.text();
                        console.error(`任务状态查询失败 (HTTP ${response.status}):`, text.substring(0, 200));
                        throw new Error(`HTTP ${response.status}: ${text.substring(0, 100)}`);
                    }
                    
                    const result = await response.json();
                    console.log('任务状态查询返回:', result);  // 调试日志
                    
                    // API返回格式: { success: true, data: { ... } }
                    if (result.success && result.data) {
                        const task = result.data;
                        updateTaskStatus(task);
                        
                        if (task.status === 'completed' || task.status === 'failed') {
                            stopPolling();
                            
                            if (task.status === 'completed') {
                                addLog('✅ 数据生成完成！', 'success');
                                showResult(task);
                            } else {
                                // 错误信息可能在 error_message 或 error 字段中
                                const errorMsg = task.error_message || task.error || '未知错误';
                                addLog(`❌ 任务失败: ${errorMsg}`, 'error');
                                showError('任务失败: ' + errorMsg);
                                console.error('任务失败详情:', task);  // 调试日志
                            }
                        }
                    }
                } catch (error) {
                    addLog(`❌ 查询任务状态失败: ${error.message}`, 'error');
                }
            }, 2000);  // 每2秒查询一次
        }
        
        function stopPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
        }
        
        function updateTaskStatus(task) {
            document.getElementById('taskStatus').textContent = task.status;
            document.getElementById('taskStatus').className = `status ${task.status}`;
            document.getElementById('progressFill').style.width = (task.progress || 0) + '%';
            document.getElementById('progressFill').textContent = (task.progress || 0) + '%';
            
            if (task.message) {
                document.getElementById('taskMessage').textContent = task.message;
            }
        }
        
        function showResult(task) {
            document.getElementById('resultSection').style.display = 'block';
            document.getElementById('resultInfo').innerHTML = `
                <div class="success-box">
                    <strong>✅ 生成成功！</strong><br>
                    任务ID: ${task.id}<br>
                    生成数量: ${task.config?.data_amount || 'N/A'}<br>
                    结果路径: ${task.result_path || 'N/A'}
                </div>
            `;
        }
        
        function downloadResult() {
            if (currentTaskId) {
                window.open(`/api/synthesis/task/${currentTaskId}/download`, '_blank');
            }
        }
        
        function viewOriginal() {
            if (currentTaskId) {
                window.open(`/api/synthesis/task/${currentTaskId}/preview?type=original`, '_blank');
            }
        }
        
        function addLog(message, type = 'info') {
            const logArea = document.getElementById('logArea');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logArea.appendChild(entry);
            logArea.scrollTop = logArea.scrollHeight;
        }
        
        function showError(message) {
            const errorBox = document.createElement('div');
            errorBox.className = 'error-box';
            errorBox.textContent = message;
            document.querySelector('.container').insertBefore(errorBox, document.querySelector('.container').firstChild);
            
            setTimeout(() => {
                errorBox.remove();
            }, 5000);
        }
        
        function clearLogs() {
            document.getElementById('logArea').innerHTML = '<div class="log-entry info">日志已清空</div>';
        }
        
        // 页面卸载时停止轮询
        window.addEventListener('beforeunload', () => {
            stopPolling();
        });
    </script>
</body>
</html>
