{% extends "base_new.html" %}

{% block title %}注册新账号 - AI 数据平台{% endblock %}

{% block extra_css %}
<style>
.register-container {
    max-width: 560px;
    margin: 0 auto;
    padding: 40px 0;
}

.register-form {
    background: var(--surface);
    border-radius: 14px;
    padding: clamp(24px, 4vw, 40px);
    border: 1px solid var(--border);
    box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
}

.register-form h2 {
    margin: 0 0 24px 0;
    font-size: clamp(22px, 3vw, 28px);
    font-weight: 600;
    color: var(--text);
    border: none;
    padding-left: 0;
}

.form-group {
    margin-bottom: 20px;
}

.form-label {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 6px;
    display: block;
}

.form-input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 14px;
    color: var(--text);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.form-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

.form-input.error {
    border-color: #ef4444;
}

.password-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

.checkbox-group {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.checkbox-group input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
}

.checkbox-group label {
    cursor: pointer;
    user-select: none;
}

.checkbox-group a {
    color: var(--primary);
    text-decoration: none;
}

.checkbox-group a:hover {
    text-decoration: underline;
}

.notice {
    margin-top: 20px;
    padding: 12px 16px;
    background: rgba(37, 99, 235, 0.08);
    border-radius: 8px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
}

.error-message {
    margin-top: 8px;
    padding: 8px 12px;
    background: rgba(239, 68, 68, 0.1);
    border-radius: 8px;
    font-size: 13px;
    color: #ef4444;
    display: none;
}

.error-message.show {
    display: block;
}

.success-message {
    margin-top: 8px;
    padding: 8px 12px;
    background: rgba(16, 185, 129, 0.1);
    border-radius: 8px;
    font-size: 13px;
    color: #10b981;
    display: none;
}

.success-message.show {
    display: block;
}

@media (max-width: 640px) {
    .password-grid {
        grid-template-columns: 1fr;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="register-container">
    <div class="register-form">
        <h2>注册新账号</h2>
        
        <form id="registerForm">
            <div class="form-group">
                <label class="form-label" for="email">邮箱</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-input" 
                    placeholder="请输入邮箱地址"
                    required
                    autocomplete="email"
                >
            </div>
            
            <div class="form-group">
                <label class="form-label" for="phone">手机号（可选）</label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    class="form-input" 
                    placeholder="请输入手机号"
                    autocomplete="tel"
                >
            </div>
            
            <div class="form-group password-grid">
                <div>
                    <label class="form-label" for="password">密码</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="请输入密码"
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                </div>
                <div>
                    <label class="form-label" for="confirm_password">确认密码</label>
                    <input 
                        type="password" 
                        id="confirm_password" 
                        name="confirm_password" 
                        class="form-input" 
                        placeholder="请再次输入密码"
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                </div>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="agree" name="agree" required>
                <label for="agree">我已阅读并同意<a href="#" target="_blank">《用户协议》</a></label>
            </div>
            
            <div class="actions">
                <button type="submit" class="button primary" style="flex: 1; width: 100%;">
                    提交注册
                </button>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            
            <div class="notice">
                提交后我们会向邮箱发送激活码，请在 30 分钟内完成激活。
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('registerForm');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    
    // 清除错误信息
    function clearMessages() {
        errorMessage.classList.remove('show');
        successMessage.classList.remove('show');
        errorMessage.textContent = '';
        successMessage.textContent = '';
    }
    
    // 显示错误信息
    function showError(message) {
        clearMessages();
        errorMessage.textContent = message;
        errorMessage.classList.add('show');
    }
    
    // 显示成功信息
    function showSuccess(message) {
        clearMessages();
        successMessage.textContent = message;
        successMessage.classList.add('show');
    }
    
    // 验证邮箱格式
    function validateEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
    }
    
    // 验证手机号格式（可选）
    function validatePhone(phone) {
        if (!phone) return true; // 手机号是可选的
        const re = /^1[3-9]\d{9}$/;
        return re.test(phone);
    }
    
    // 验证密码（与后端保持一致：至少8位，包含字母和数字）
    function validatePassword(password) {
        if (password.length < 8) {
            return '密码长度至少8位';
        }
        if (!/[A-Za-z]/.test(password)) {
            return '密码必须包含字母';
        }
        if (!/[0-9]/.test(password)) {
            return '密码必须包含数字';
        }
        return null;
    }
    
    // 表单提交处理
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        clearMessages();
        
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        const agree = document.getElementById('agree').checked;
        
        // 验证必填字段
        if (!email || !password || !confirmPassword) {
            showError('请填写所有必填字段');
            return;
        }
        
        // 验证用户协议
        if (!agree) {
            showError('请阅读并同意《用户协议》');
            return;
        }
        
        // 验证邮箱格式
        if (!validateEmail(email)) {
            showError('邮箱格式不正确');
            document.getElementById('email').classList.add('error');
            return;
        }
        document.getElementById('email').classList.remove('error');
        
        // 验证手机号格式（如果填写了）
        if (phone && !validatePhone(phone)) {
            showError('手机号格式不正确');
            document.getElementById('phone').classList.add('error');
            return;
        }
        document.getElementById('phone').classList.remove('error');
        
        // 验证密码
        const passwordError = validatePassword(password);
        if (passwordError) {
            showError(passwordError);
            document.getElementById('password').classList.add('error');
            return;
        }
        document.getElementById('password').classList.remove('error');
        
        // 验证密码确认
        if (password !== confirmPassword) {
            showError('两次输入的密码不一致');
            document.getElementById('confirm_password').classList.add('error');
            return;
        }
        document.getElementById('confirm_password').classList.remove('error');
        
        // 提交注册请求
        try {
            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                credentials: 'include',
                body: JSON.stringify({
                    email: email,
                    phone: phone || null,
                    password: password,
                    confirm_password: confirmPassword
                })
            });
            
            const data = await response.json();
            
            if (data.success) {
                showSuccess('注册成功！激活码已发送至邮箱，请查收。');
                // 保存邮箱到sessionStorage，用于激活页面
                sessionStorage.setItem('register_email', email);
                // 3秒后跳转到激活页面
                setTimeout(() => {
                    window.location.href = '/api/auth/activate';
                }, 3000);
            } else {
                const errorMsg = data.message || data.error || '注册失败，请重试';
                showError(errorMsg);
                // 如果是邮箱已存在，高亮邮箱输入框
                if (errorMsg.includes('邮箱') || errorMsg.includes('已存在')) {
                    document.getElementById('email').classList.add('error');
                }
            }
        } catch (error) {
            console.error('注册失败:', error);
            showError('网络错误，请重试');
        }
    });
    
    // 实时验证输入
    document.getElementById('email').addEventListener('blur', function() {
        const email = this.value.trim();
        if (email && !validateEmail(email)) {
            this.classList.add('error');
        } else {
            this.classList.remove('error');
        }
    });
    
    document.getElementById('phone').addEventListener('blur', function() {
        const phone = this.value.trim();
        if (phone && !validatePhone(phone)) {
            this.classList.add('error');
        } else {
            this.classList.remove('error');
        }
    });
    
    document.getElementById('confirm_password').addEventListener('blur', function() {
        const password = document.getElementById('password').value;
        const confirmPassword = this.value;
        if (confirmPassword && password !== confirmPassword) {
            this.classList.add('error');
        } else {
            this.classList.remove('error');
        }
    });
});
</script>
{% endblock %}
