{% extends "base_new.html" %}

{% block title %}注册{% endblock %}

{% block extra_css %}
<style>
.register-container {
    max-width: 560px;
    margin: 0 auto;
}
.form-group {
    margin-bottom: 20px;
}
.form-label {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 6px;
    display: block;
}
.form-input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 14px;
    color: var(--text);
}
.form-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}
.checkbox-group {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 20px;
}
.checkbox-group input[type="checkbox"] {
    margin-right: 6px;
}
.notice {
    margin-top: 20px;
    padding: 12px;
    background: rgba(37, 99, 235, 0.08);
    border-radius: 8px;
    font-size: 13px;
    color: var(--muted);
}
.error-message {
    color: #dc2626;
    font-size: 13px;
    margin-top: 6px;
}
</style>
{% endblock %}

{% block content %}
<section class="section">
    <div class="panel register-container">
        <h2 style="border: none; padding-left: 0; margin-bottom: 24px;">注册新账号</h2>
        <form id="registerForm">
            <div class="form-group">
                <label class="form-label">邮箱</label>
                <input type="email" class="form-input" id="email" name="email" required>
                <div class="error-message" id="email-error"></div>
            </div>
            <div class="form-group">
                <label class="form-label">手机号（可选）</label>
                <input type="tel" class="form-input" id="phone" name="phone">
            </div>
            <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-input" id="password" name="password" required>
                    <div class="error-message" id="password-error"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">确认密码</label>
                    <input type="password" class="form-input" id="confirm_password" name="confirm_password" required>
                    <div class="error-message" id="confirm-password-error"></div>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">验证码 <span style="color: #dc2626;">*</span></label>
                <div style="display: flex; gap: 12px; align-items: stretch;">
                    <input type="text" class="form-input" id="captcha" name="captcha" required 
                           placeholder="请输入计算结果" style="flex: 1;" maxlength="10">
                    <div id="captcha-display" style="
                        min-width: 140px;
                        padding: 14px 16px;
                        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
                        border: 1px solid var(--border);
                        border-radius: 12px;
                        text-align: center;
                        font-size: 20px;
                        font-weight: 700;
                        color: var(--primary);
                        user-select: none;
                        cursor: pointer;
                        position: relative;
                        transition: all 0.2s;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                    " title="点击刷新验证码" onmouseover="this.style.background='linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%)'; this.style.borderColor='var(--primary)';" onmouseout="this.style.background='linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%)'; this.style.borderColor='var(--border)';">
                        <span id="captcha-text">加载中...</span>
                    </div>
                </div>
                <div class="error-message" id="captcha-error"></div>
            </div>
            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="agree" required>
                    我已阅读并同意<a href="/api/auth/agreement" target="_blank" style="color: var(--primary); text-decoration: none; margin-left: 4px;">《用户协议》</a>
                </label>
            </div>
            <div class="actions">
                <button type="submit" class="button primary" style="flex: 1;">提交注册</button>
            </div>
            <div class="notice">
                提交后我们会向邮箱发送激活码，请在 30 分钟内完成激活。
            </div>
        </form>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
// 自定义弹窗函数
function showModal(title, message, type = 'info', onConfirm = null) {
    const modal = document.createElement('div');
    modal.className = 'custom-modal';
    modal.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 2000;';
    
    const iconMap = {
        'success': '✅',
        'error': '❌',
        'warning': '⚠️',
        'info': 'ℹ️'
    };
    
    const colorMap = {
        'success': '#10b981',
        'error': '#dc2626',
        'warning': '#f59e0b',
        'info': '#3b82f6'
    };
    
    // 生成唯一的回调函数名
    const callbackName = onConfirm ? 'modalCallback_' + Date.now() : null;
    if (onConfirm && callbackName) {
        window[callbackName] = function() {
            if (typeof onConfirm === 'function') {
                onConfirm();
            }
            const modal = document.querySelector('.custom-modal');
            if (modal) {
                modal.remove();
            }
            delete window[callbackName];
        };
    }
    
    modal.innerHTML = `
        <div style="background: white; border-radius: 12px; padding: 24px; width: 90%; max-width: 500px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="margin: 0; font-size: 18px; font-weight: 600; color: ${colorMap[type] || colorMap.info};">${iconMap[type] || iconMap.info} ${title}</h3>
                <div style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); font-size: 20px;" onclick="this.closest('.custom-modal').remove(); ${callbackName ? 'if (window.' + callbackName + ') delete window.' + callbackName + ';' : ''}">✕</div>
            </div>
            <div style="color: var(--text); font-size: 14px; line-height: 1.6; margin-bottom: 20px; white-space: pre-wrap;">${message}</div>
            <div style="display: flex; justify-content: flex-end; gap: 12px;">
                <button class="button primary" onclick="${callbackName ? callbackName + '()' : 'this.closest(\'.custom-modal\').remove();'}" style="padding: 10px 20px;">
                    确定
                </button>
            </div>
        </div>
    `;
    
    document.body.appendChild(modal);
}

// 加载验证码
async function loadCaptcha() {
    try {
        const response = await fetch('/api/auth/captcha', {
            method: 'GET',
            credentials: 'include'
        });
        const result = await response.json();
        
        if (result.success) {
            const captchaText = document.getElementById('captcha-text');
            if (result.data.type === 'math') {
                captchaText.textContent = result.data.question + ' = ?';
            } else {
                captchaText.textContent = result.data.code || '点击刷新';
            }
        } else {
            document.getElementById('captcha-text').textContent = '加载失败';
        }
    } catch (error) {
        console.error('加载验证码失败:', error);
        document.getElementById('captcha-text').textContent = '加载失败';
    }
}

// 点击验证码图形刷新
const captchaDisplay = document.getElementById('captcha-display');

captchaDisplay.addEventListener('click', function() {
    loadCaptcha();
    // 清空验证码输入框
    document.getElementById('captcha').value = '';
    document.getElementById('captcha-error').textContent = '';
    
    // 添加点击动画效果
    this.style.transform = 'scale(0.95)';
    setTimeout(() => {
        this.style.transform = 'scale(1)';
    }, 150);
});

// 页面加载时获取验证码
loadCaptcha();

document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    // 清除之前的错误
    document.querySelectorAll('.error-message').forEach(el => el.textContent = '');
    
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    const captcha = document.getElementById('captcha').value.trim();
    const agree = document.getElementById('agree').checked;
    
    // 验证
    if (!agree) {
        showModal('提示', '请先同意用户协议', 'warning');
        return;
    }
    
    if (!captcha) {
        document.getElementById('captcha-error').textContent = '请输入验证码';
        return;
    }
    
    if (password !== confirmPassword) {
        document.getElementById('confirm-password-error').textContent = '两次输入的密码不一致';
        return;
    }
    
    if (password.length < 8) {
        document.getElementById('password-error').textContent = '密码长度至少8位';
        return;
    }
    
    try {
        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            credentials: 'include',
            body: JSON.stringify({
                email: email,
                phone: phone || '',
                password: password,
                confirm_password: confirmPassword,
                captcha: captcha
            })
        });
        
        const result = await response.json();
        
        if (result.success) {
            // 保存邮箱到sessionStorage，用于激活页面
            sessionStorage.setItem('register_email', email);
            
            // 构建成功消息
            let successMessage = '注册成功！\n\n';
            if (result.data?.message) {
                successMessage += result.data.message;
            } else {
                successMessage += '激活码已发送至您的邮箱，请查收。\n\n';
                successMessage += '请在 24 小时内完成账号激活。';
            }
            
            // 如果邮件发送失败，显示激活码
            if (result.data?.activation_code) {
                successMessage += `\n\n⚠️ 邮件发送失败，您的激活码是：\n${result.data.activation_code}`;
            }
            
            showModal('注册成功', successMessage, 'success', function() {
                window.location.href = '/api/auth/activate';
            });
        } else {
            // 显示错误信息
            if (result.code === 'CAPTCHA_INVALID' || result.code === 'CAPTCHA_EXPIRED') {
                document.getElementById('captcha-error').textContent = result.error;
                // 自动刷新验证码
                loadCaptcha();
                document.getElementById('captcha').value = '';
            } else if (result.error.includes('邮箱')) {
                document.getElementById('email-error').textContent = result.error;
            } else if (result.error.includes('密码')) {
                document.getElementById('password-error').textContent = result.error;
            } else {
                showModal('注册失败', result.error || '注册失败，请稍后重试', 'error');
            }
        }
    } catch (error) {
        console.error('注册失败:', error);
        showModal('网络错误', '网络连接失败，请检查网络后重试', 'error');
    }
});
</script>
{% endblock %}
