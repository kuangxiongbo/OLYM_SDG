{% extends "base_new.html" %}

{% block title %}系统设置{% endblock %}

{% block extra_css %}
<style>
.tab-menu {
    display: flex;
    gap: 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
    padding: 0 12px;
}
.tab-menu button {
    position: relative;
    padding: 12px 0;
    border: none;
    background: transparent;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.2s ease;
    flex: 1;
    text-align: center;
}
.tab-menu button.active {
    color: var(--primary);
}
.tab-menu button::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    height: 3px;
    background: transparent;
    transition: background 0.2s ease;
}
.tab-menu button.active::after {
    background: var(--primary);
}
.tab-content [data-tab] {
    display: none;
}
.tab-content [data-tab].active {
    display: block;
}
.model-service-item {
    padding: 12px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.2s;
    margin-bottom: 8px;
}
.model-service-item:hover {
    background: #f8fafc;
}
.model-service-item.active {
    background: #f1f5f9;
    border-color: var(--primary);
}
.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #94a3b8;
}
.status-dot.active {
    background: #10b981;
}
.form-group {
    margin-bottom: 18px;
}
.form-label {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 6px;
    display: block;
}
.form-input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 14px;
    color: var(--text);
}
.form-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}
.toggle-switch {
    width: 44px;
    height: 24px;
    border-radius: 12px;
    background: var(--border);
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
}
.toggle-switch.active {
    background: var(--primary);
}
.toggle-switch::after {
    content: "";
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    position: absolute;
    left: 2px;
    top: 2px;
    transition: transform 0.2s;
}
.toggle-switch.active::after {
    transform: translateX(20px);
}
</style>
{% endblock %}

{% block content %}
<section class="section">
    <div class="tab-menu">
        <button class="active" data-tab-target="model" onclick="switchTab('model')">AI 大模型配置</button>
        <button data-tab-target="mail" onclick="switchTab('mail')">邮箱服务器配置</button>
        <button data-tab-target="admin" onclick="switchTab('admin')">管理员管理</button>
        <button data-tab-target="logs" onclick="switchTab('logs')">操作日志</button>
    </div>
    <div class="panel">
        <div class="tab-content">
            <!-- AI 大模型配置 -->
            <div data-tab="model" class="active">
                <div id="model-content">
                    <p>加载中...</p>
                </div>
            </div>
            
            <!-- 邮箱服务器配置 -->
            <div data-tab="mail">
                <div id="mail-content">
                    <p>加载中...</p>
                </div>
            </div>
            
            <!-- 管理员管理 -->
            <div data-tab="admin">
                <div id="admin-content">
                    <p>加载中...</p>
                </div>
            </div>
            
            <!-- 操作日志 -->
            <div data-tab="logs">
                <div id="logs-content">
                    <p>加载中...</p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
let currentTab = 'model';

function switchTab(tab) {
    currentTab = tab;
    // 更新tab按钮状态
    document.querySelectorAll('.tab-menu button').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.tabTarget === tab) {
            btn.classList.add('active');
        }
    });
    // 更新内容显示
    document.querySelectorAll('.tab-content [data-tab]').forEach(content => {
        content.classList.remove('active');
        if (content.dataset.tab === tab) {
            content.classList.add('active');
        }
    });
    // 加载对应内容
    loadTabContent(tab);
}

async function loadTabContent(tab) {
    const contentDiv = document.getElementById(`${tab}-content`);
    
    try {
        if (tab === 'model') {
            const response = await fetch('/api/settings/ai-models');
            const result = await response.json();
            if (result.success) {
                contentDiv.innerHTML = renderModelConfig(result.data.models);
                
                // 默认选中第一个模型
                if (result.data.models && result.data.models.length > 0) {
                    const firstModelId = result.data.models[0].id;
                    // 延迟执行，确保DOM已渲染
                    setTimeout(() => {
                        selectModel(firstModelId);
                    }, 100);
                }
            }
        } else if (tab === 'mail') {
            const response = await fetch('/api/settings/email');
            const result = await response.json();
            if (result.success) {
                contentDiv.innerHTML = renderEmailConfig(result.data);
            }
        } else if (tab === 'admin') {
            const response = await fetch('/api/settings/admins');
            const result = await response.json();
            if (result.success) {
                contentDiv.innerHTML = renderAdminList(result.data.admins);
            }
        } else if (tab === 'logs') {
            const response = await fetch('/api/settings/logs');
            const result = await response.json();
            if (result.success) {
                contentDiv.innerHTML = renderLogs(result.data.logs, result.data.pagination);
            }
        }
    } catch (error) {
        console.error('加载失败:', error);
        contentDiv.innerHTML = '<p style="color: #dc2626;">加载失败，请刷新重试</p>';
    }
}

// 模型图标映射（根据实际服务商logo特征）
const modelIconMap = {
    'ollama': '🦙',           // Ollama - 羊驼
    'tongyi': '🔷',           // 通义千问 - 紫色几何
    'openai': '🤖',          // OpenAI - 抽象logo
    'claude': '⭐',           // Claude - 星形
    'gemini': '💎',          // Gemini - 彩色钻石
    'deepseek': '🐋',        // Deepseek - 鲸鱼
    'moonshot': '🌙',        // Moonshot - 月亮
    'doubao': '🌋',          // 火山方舟(豆包) - 火山
    'qianfan': '🔷',         // 百度云千帆 - 多色几何
    'hunyuan': '🌊',         // 腾讯混元 - 波浪
    'zhipu': '🔵',           // 智谱 - 点簇
    'grok': '❌',            // Grok - X符号
    'openrouter': '⬅️',      // OpenRouter - 左箭头
    'siliconflow': '♾️'      // 硅基流动 - 无穷符号
};

function renderModelConfig(models) {
    // 简化的模型配置渲染
    return `
        <div class="grid" style="grid-template-columns: 280px 1fr; gap: 24px;">
            <div style="background: #f8fafc; border-radius: 12px; padding: 16px; border: 1px solid var(--border); max-height: 600px; overflow-y: auto;">
                <h3 style="margin: 0 0 16px 0; font-size: 16px;">模型服务</h3>
                <div id="model-list">
                    ${models.map(m => {
                        const icon = modelIconMap[m.id] || '⚫';
                        return `
                        <div class="model-service-item" data-model-id="${m.id}" onclick="selectModel('${m.id}')">
                            <div style="width: 32px; height: 32px; border-radius: 50%; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 18px;">${icon}</div>
                            <div style="flex: 1; font-weight: 500;">${m.name}</div>
                            <div class="status-dot ${m.enabled ? 'active' : ''}"></div>
                        </div>
                    `;
                    }).join('')}
                </div>
            </div>
            <div id="model-detail">
                <p style="color: var(--muted);">请选择一个模型服务进行配置</p>
            </div>
        </div>
    `;
}

function renderEmailConfig(config) {
    // 兼容新旧格式：如果config是旧格式（有smtp_host），直接使用；否则使用custom服务商的配置
    let emailConfig = {};
    if (config.smtp_host) {
        // 旧格式
        emailConfig = config;
    } else if (config.custom) {
        // 新格式，使用custom服务商
        emailConfig = config.custom;
        // 从config中获取smtp相关配置（如果有）
        if (config.smtp_host) {
            emailConfig.smtp_host = config.smtp_host;
        }
        if (config.smtp_port) {
            emailConfig.smtp_port = config.smtp_port;
        }
    }
    
    // 默认值
    const smtpHost = emailConfig.smtp_host || '';
    const smtpPort = emailConfig.smtp_port || '465';
    const senderEmail = emailConfig.sender_email || '';
    const authCode = emailConfig.password || emailConfig.auth_code || '';
    const encryption = emailConfig.encryption || 'SSL'; // 默认SSL
    
    return `
        <h3 style="margin: 0 0 20px 0;">邮箱服务器配置</h3>
        <form id="email-form">
            <div class="form-group">
                <label class="form-label">SMTP 服务器地址 <span style="color: #dc2626;">*</span></label>
                <input type="text" class="form-input" id="smtp_host" value="${smtpHost}" placeholder="例如: smtp.163.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">加密协议 <span style="color: #dc2626;">*</span></label>
                <select class="form-input" id="encryption" required onchange="updatePortByEncryption()">
                    <option value="SSL" ${encryption === 'SSL' ? 'selected' : ''}>SSL (端口通常为465)</option>
                    <option value="TLS" ${encryption === 'TLS' ? 'selected' : ''}>TLS (端口通常为587)</option>
                    <option value="NONE" ${encryption === 'NONE' ? 'selected' : ''}>无加密 (不推荐，端口通常为25)</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">端口 <span style="color: #dc2626;">*</span></label>
                <input type="number" class="form-input" id="smtp_port" value="${smtpPort}" placeholder="465 (SSL) 或 587 (TLS)" required onchange="updateEncryptionByPort()">
                <small style="color: var(--muted); font-size: 12px; margin-top: 4px; display: block;">
                    常用端口：465 (SSL), 587 (TLS), 25 (不加密，不推荐)
                </small>
            </div>
            <div class="form-group">
                <label class="form-label">发件人邮箱 <span style="color: #dc2626;">*</span></label>
                <input type="email" class="form-input" id="sender_email" value="${senderEmail}" placeholder="例如: your-email@163.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">授权码/密码 <span style="color: #dc2626;">*</span></label>
                <input type="password" class="form-input" id="auth_code" value="${authCode ? '***' : ''}" placeholder="请输入SMTP授权码或密码" data-original-value="${authCode || ''}" required>
                <small style="color: var(--muted); font-size: 12px; margin-top: 4px; display: block;">
                    注意：163邮箱等需要使用授权码，不是登录密码
                </small>
            </div>
            <div class="actions">
                <button type="button" class="button secondary" onclick="testEmail()">发送测试邮件</button>
                <button type="submit" class="button primary">保存配置</button>
            </div>
        </form>
    `;
}

function renderAdminList(admins) {
    // 获取当前用户ID（从全局变量或通过其他方式）
    const currentUserId = window.currentUserId || null;
    
    return `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="margin: 0;">管理员列表</h3>
            <button class="button primary" onclick="createAdmin()">创建管理员</button>
        </div>
        <table class="table">
            <thead>
                <tr><th>邮箱</th><th>姓名</th><th>角色</th><th>状态</th><th>操作</th></tr>
            </thead>
            <tbody>
                ${admins.length > 0 ? admins.map(admin => `
                    <tr>
                        <td>${admin.email}</td>
                        <td>${admin.name || '-'}</td>
                        <td>
                            <span style="
                                padding: 4px 8px;
                                border-radius: 4px;
                                font-size: 12px;
                                font-weight: 500;
                                background: ${admin.role === 'super_admin' ? '#dc2626' : admin.role === 'admin' ? '#2563eb' : '#6b7280'};
                                color: white;
                            ">
                                ${admin.role === 'super_admin' ? '超级管理员' : admin.role === 'admin' ? '管理员' : '普通用户'}
                            </span>
                        </td>
                        <td>
                            <span style="color: ${admin.status === 'active' ? '#10b981' : '#dc2626'}; font-weight: 500;">
                                ${admin.status === 'active' ? '正常' : (admin.status === 'disabled' ? '禁用' : '待激活')}
                            </span>
                        </td>
                        <td>
                            ${admin.id !== currentUserId ? `
                                <a href="#" onclick="event.preventDefault(); editAdmin(${admin.id});" style="color: var(--primary); text-decoration: none; margin-right: 12px;">编辑</a>
                                <a href="#" onclick="event.preventDefault(); resetPassword(${admin.id});" style="color: var(--primary); text-decoration: none; margin-right: 12px;">重置密码</a>
                                <a href="#" onclick="event.preventDefault(); toggleAdminStatus(${admin.id});" style="color: ${admin.status === 'active' ? '#dc2626' : '#10b981'}; text-decoration: none; margin-right: 12px;">
                                    ${admin.status === 'active' ? '禁用' : '启用'}
                                </a>
                                ${admin.role !== 'admin' && admin.role !== 'super_admin' ? `
                                    <a href="#" onclick="event.preventDefault(); promoteToAdmin(${admin.id}, '${admin.email}');" style="color: var(--primary); text-decoration: none; margin-right: 12px;">提升为管理员</a>
                                ` : ''}
                                <a href="#" onclick="event.preventDefault(); deleteAdmin(${admin.id}, '${admin.email}');" style="color: #dc2626; text-decoration: none;">
                                    删除
                                </a>
                            ` : `
                                <span style="color: var(--muted); font-size: 13px;">当前用户</span>
                            `}
                        </td>
                    </tr>
                `).join('') : '<tr><td colspan="4" style="text-align: center; color: var(--muted); padding: 20px;">暂无管理员</td></tr>'}
            </tbody>
        </table>
    `;
}

function renderLogs(logs, pagination) {
    const currentPage = pagination?.page || 1;
    const totalPages = pagination?.total_pages || 1;
    const total = pagination?.total || 0;
    const pageSize = pagination?.page_size || 20;
    
    return `
        <h3 style="margin: 0 0 20px 0;">操作日志</h3>
        <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
            <input type="text" class="form-input" id="log-keyword" placeholder="关键词搜索" style="max-width: 300px; display: inline-block;" onkeypress="if(event.key==='Enter') searchLogs()">
            <button class="button secondary" onclick="searchLogs()">搜索</button>
            <div style="margin-left: auto; color: var(--muted); font-size: 14px;">
                共 ${total} 条记录，第 ${currentPage}/${totalPages} 页
            </div>
        </div>
        <table class="table">
            <thead>
                <tr><th>时间</th><th>操作人</th><th>操作</th><th>结果</th><th>详情</th></tr>
            </thead>
            <tbody>
                ${logs.length > 0 ? logs.map(log => {
                    // 格式化详情显示
                    let detailsDisplay = '-';
                    if (log.details) {
                        try {
                            // 如果是字符串，尝试解析为JSON
                            let detailsObj = log.details;
                            if (typeof log.details === 'string') {
                                try {
                                    detailsObj = JSON.parse(log.details);
                                } catch {
                                    detailsDisplay = log.details;
                                }
                            }
                            
                            // 如果是对象，格式化显示
                            if (typeof detailsObj === 'object' && detailsObj !== null) {
                                const detailItems = [];
                                for (const [key, value] of Object.entries(detailsObj)) {
                                    // 跳过错误信息（失败时显示）
                                    if (key === 'error') continue;
                                    // 格式化显示
                                    if (value !== null && value !== undefined && value !== '') {
                                        if (typeof value === 'object') {
                                            detailItems.push(`${key}: ${JSON.stringify(value)}`);
                                        } else {
                                            detailItems.push(`${key}: ${value}`);
                                        }
                                    }
                                }
                                if (detailItems.length > 0) {
                                    detailsDisplay = detailItems.join(', ');
                                } else if (detailsObj.error) {
                                    detailsDisplay = `<span style="color: #dc2626;">错误: ${detailsObj.error}</span>`;
                                } else {
                                    detailsDisplay = '-';
                                }
                            }
                        } catch (e) {
                            detailsDisplay = String(log.details);
                        }
                    }
                    
                    return `
                    <tr>
                        <td>${new Date(log.timestamp).toLocaleString('zh-CN', {year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit'})}</td>
                        <td>${log.user_email || '-'}</td>
                        <td>${log.action}</td>
                        <td><span style="color: ${log.result === 'success' ? '#10b981' : '#dc2626'}; font-weight: 500;">${log.result === 'success' ? '成功' : '失败'}</span></td>
                        <td style="max-width: 300px; word-break: break-word; font-size: 12px; color: var(--muted);">${detailsDisplay}</td>
                    </tr>
                `;
                }).join('') : '<tr><td colspan="5" style="text-align: center; color: var(--muted); padding: 20px;">暂无日志记录</td></tr>'}
            </tbody>
        </table>
        ${totalPages > 1 ? `
        <div style="margin-top: 20px; display: flex; justify-content: center; align-items: center; gap: 8px;">
            <button 
                class="button secondary" 
                onclick="loadLogsPage(${currentPage - 1})" 
                ${currentPage <= 1 ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : ''}
                style="padding: 8px 16px;"
            >
                上一页
            </button>
            <div style="display: flex; gap: 4px; align-items: center;">
                ${Array.from({length: Math.min(totalPages, 10)}, (_, i) => {
                    let pageNum;
                    if (totalPages <= 10) {
                        pageNum = i + 1;
                    } else if (currentPage <= 5) {
                        pageNum = i + 1;
                    } else if (currentPage >= totalPages - 4) {
                        pageNum = totalPages - 9 + i;
                    } else {
                        pageNum = currentPage - 5 + i;
                    }
                    
                    if (i === 0 && pageNum > 1) {
                        return `<button class="button secondary" onclick="loadLogsPage(1)" style="padding: 8px 12px; min-width: 40px;">1</button>${pageNum > 2 ? '<span style="padding: 0 4px;">...</span>' : ''}`;
                    }
                    if (i === 9 && pageNum < totalPages) {
                        return `${pageNum < totalPages - 1 ? '<span style="padding: 0 4px;">...</span>' : ''}<button class="button secondary" onclick="loadLogsPage(${totalPages})" style="padding: 8px 12px; min-width: 40px;">${totalPages}</button>`;
                    }
                    
                    return `
                        <button 
                            class="button ${pageNum === currentPage ? 'primary' : 'secondary'}" 
                            onclick="loadLogsPage(${pageNum})" 
                            style="padding: 8px 12px; min-width: 40px; ${pageNum === currentPage ? 'background: var(--primary); color: white;' : ''}"
                        >
                            ${pageNum}
                        </button>
                    `;
                }).join('')}
            </div>
            <button 
                class="button secondary" 
                onclick="loadLogsPage(${currentPage + 1})" 
                ${currentPage >= totalPages ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : ''}
                style="padding: 8px 16px;"
            >
                下一页
            </button>
            <select id="log-page-size" onchange="changeLogPageSize()" style="padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; margin-left: 12px;">
                <option value="10" ${pageSize === 10 ? 'selected' : ''}>10条/页</option>
                <option value="20" ${pageSize === 20 ? 'selected' : ''}>20条/页</option>
                <option value="50" ${pageSize === 50 ? 'selected' : ''}>50条/页</option>
                <option value="100" ${pageSize === 100 ? 'selected' : ''}>100条/页</option>
            </select>
        </div>
        ` : ''}
    `;
}

let selectedModelId = null;

async function selectModel(modelId) {
    selectedModelId = modelId;
    
    // 更新选中状态
    document.querySelectorAll('.model-service-item').forEach(item => {
        item.classList.remove('active');
        if (item.dataset.modelId === modelId) {
            item.classList.add('active');
        }
    });
    
    // 加载模型详情
    const detailDiv = document.getElementById('model-detail');
    detailDiv.innerHTML = '<p>加载中...</p>';
    
    try {
        // 获取模型列表以找到选中的模型
        const response = await fetch('/api/settings/ai-models');
        const result = await response.json();
        
        if (result.success) {
            const model = result.data.models.find(m => m.id === modelId);
            if (model) {
                detailDiv.innerHTML = renderModelDetail(model);
                
                // 加载已保存的模型列表和配置
                if (model.config) {
                    selectedModelsCache[modelId] = model.config.selected_models || [];
                    modelConfigCache[modelId] = model.config.model_configs || {};
                    console.log(`✅ 加载已保存的模型列表: ${modelId}`, selectedModelsCache[modelId]);
                    console.log(`✅ 加载已保存的模型配置: ${modelId}`, modelConfigCache[modelId]);
                } else {
                    selectedModelsCache[modelId] = [];
                    modelConfigCache[modelId] = {};
                    console.log(`[DEBUG] 未找到已保存的模型列表: ${modelId}, config:`, model.config);
                }
                
                // 如果已保存的模型列表不为空，更新显示
                if (selectedModelsCache[modelId] && selectedModelsCache[modelId].length > 0) {
                    // 延迟更新，确保DOM已渲染
                    setTimeout(() => {
                        updateConfigModelList(modelId);
                    }, 100);
                } else {
                    // 即使为空，也初始化显示
                    setTimeout(() => {
                        updateConfigModelList(modelId);
                    }, 100);
                }
            } else {
                detailDiv.innerHTML = '<p style="color: #dc2626;">未找到模型配置</p>';
            }
        } else {
            detailDiv.innerHTML = '<p style="color: #dc2626;">加载失败，请刷新重试</p>';
        }
    } catch (error) {
        console.error('加载模型详情失败:', error);
        detailDiv.innerHTML = '<p style="color: #dc2626;">加载失败，请刷新重试</p>';
    }
}

function toggleModelEnabled(modelId) {
    const toggle = document.getElementById(`toggle-${modelId}`);
    const isEnabled = toggle.classList.contains('active');
    const newEnabled = !isEnabled;
    
    if (newEnabled) {
        toggle.classList.add('active');
    } else {
        toggle.classList.remove('active');
    }
    
    // 更新表单字段状态
    const apiKeyInput = document.getElementById(`api-key-${modelId}`);
    const endpointInput = document.getElementById(`endpoint-${modelId}`);
    const testBtn = document.getElementById(`test-connection-${modelId}`);
    const manageBtn = document.getElementById(`manage-models-btn-${modelId}`);
    const apiKeyToggle = document.getElementById(`api-key-toggle-${modelId}`);
    
    [apiKeyInput, endpointInput, testBtn, manageBtn, apiKeyToggle].forEach(el => {
        if (el) {
            el.disabled = !newEnabled;
            el.style.opacity = newEnabled ? '1' : '0.6';
            el.style.cursor = newEnabled ? (el.tagName === 'INPUT' ? 'text' : 'pointer') : 'not-allowed';
        }
    });
    
    // 即时保存启用状态
    saveModelEnabled(modelId, newEnabled);
}

async function saveModelEnabled(modelId, enabled) {
    // 防止重复保存
    if (isSaving[modelId]) {
        return;
    }
    
    // 保存启用状态时，同时保存完整的配置（包括API Key和endpoint）
    const apiKeyInput = document.getElementById(`api-key-${modelId}`);
    const endpointInput = document.getElementById(`endpoint-${modelId}`);
    
    isSaving[modelId] = true;
    
    try {
        let apiKey = '';
        let endpoint = '';
        
        if (apiKeyInput) {
            apiKey = apiKeyInput.value;
            if (apiKey === '***' && apiKeyInput.dataset.originalValue) {
                apiKey = apiKeyInput.dataset.originalValue;
            }
        }
        
        if (endpointInput) {
            endpoint = endpointInput.value || '';
        }
        
        const response = await fetch(`/api/settings/ai-models/${modelId}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                enabled: enabled,
                config: {
                    api_key: apiKey || '',
                    endpoint: endpoint
                }
            })
        });
        
        const result = await response.json();
        if (result.success) {
            console.log(`✅ 启用状态已保存: ${modelId} = ${enabled}`);
        } else {
            console.error('❌ 保存失败:', result.error);
        }
    } catch (error) {
        console.error('❌ 保存启用状态失败:', error);
    } finally {
        isSaving[modelId] = false;
    }
}

function getDefaultEndpoint(serviceId) {
    const endpoints = {
        'tongyi': 'https://dashscope.aliyuncs.com/compatible-mode/v1',
        'openai': 'https://api.openai.com/v1',
        'claude': 'https://api.anthropic.com/v1',
        'gemini': 'https://generativelanguage.googleapis.com/v1',
        'deepseek': 'https://api.deepseek.com/v1',
        'moonshot': 'https://api.moonshot.cn/v1',
        'doubao': 'https://ark.cn-beijing.volces.com/api/v3',
        'qianfan': 'https://aip.baidubce.com/rpc/2.0/ai_custom/v1',
        'hunyuan': 'https://hunyuan.tencentcloudapi.com',
        'zhipu': 'https://open.bigmodel.cn/api/paas/v4',
        'ollama': 'http://localhost:11434/v1',
        'grok': 'https://api.x.ai/v1',
        'openrouter': 'https://openrouter.ai/api/v1',
        'siliconflow': 'https://api.siliconflow.cn/v1'
    };
    return endpoints[serviceId] || '';
}

function getChatEndpoint(serviceId, baseEndpoint) {
    if (!baseEndpoint) return '';
    
    const endpoint = baseEndpoint.trim().replace(/\/$/, '');
    
    if (serviceId === 'ollama') {
        return `${endpoint}/chat/completions`;
    } else if (serviceId === 'claude') {
        return `${endpoint}/v1/messages`;
    } else if (serviceId === 'gemini') {
        return `${endpoint}/models/gemini-pro:generateContent`;
    } else {
        const versionMatch = endpoint.match(/\/(v\d+)$/);
        if (versionMatch) {
            return `${endpoint}/chat/completions`;
        } else {
            return `${endpoint}/v1/chat/completions`;
        }
    }
}

function getEndpointPreview(serviceId, baseEndpoint) {
    if (!baseEndpoint) return '请输入中转地址';
    const chatEndpoint = getChatEndpoint(serviceId, baseEndpoint);
    return chatEndpoint || `${baseEndpoint}/chat/completions`;
}

function handleApiKeyInput(modelId) {

let saveTimeout = {};
let isSaving = {}; // 防止重复保存

function scheduleSaveModelConfig(modelId) {
    if (saveTimeout[modelId]) {
        clearTimeout(saveTimeout[modelId]);
    }
    // 延迟500ms自动保存，避免频繁请求
    saveTimeout[modelId] = setTimeout(() => {
        if (!isSaving[modelId]) {
            saveModelConfigAuto(modelId);
        }
    }, 500);
}

async function saveModelConfigAuto(modelId) {
    // 防止重复保存
    if (isSaving[modelId]) {
        return;
    }
    
    const apiKeyInput = document.getElementById(`api-key-${modelId}`);
    const endpointInput = document.getElementById(`endpoint-${modelId}`);
    const toggle = document.getElementById(`toggle-${modelId}`);
    
    if (!apiKeyInput || !endpointInput) return;
    
    isSaving[modelId] = true;
    
    try {
        // 获取当前的启用状态
        const enabled = toggle ? toggle.classList.contains('active') : false;
        
        // 获取API Key值：优先使用输入框的值，如果是***则使用原始值
        let apiKey = '';
        const inputValue = apiKeyInput.value.trim();
        
        if (inputValue === '***') {
            // 如果显示的是***，使用原始值（已保存的值）
            apiKey = apiKeyInput.dataset.originalValue || '';
            console.log(`[DEBUG] API Key显示为***，使用原始值: ${apiKey ? '已设置' : '空'}`);
        } else if (inputValue) {
            // 用户输入了新值，使用新值并更新原始值
            apiKey = inputValue;
            apiKeyInput.dataset.originalValue = apiKey;
            console.log(`[DEBUG] API Key用户输入新值: ${apiKey.substring(0, 4)}...`);
        } else {
            // 如果为空，清空
            apiKey = '';
            apiKeyInput.dataset.originalValue = '';
            console.log(`[DEBUG] API Key为空，清空配置`);
        }
        
        const endpoint = endpointInput.value.trim() || '';
        
        console.log(`[DEBUG] 准备保存配置 - modelId: ${modelId}, apiKey: ${apiKey ? '已设置(' + apiKey.length + '字符)' : '空'}, endpoint: ${endpoint || '空'}`);
        
        const response = await fetch(`/api/settings/ai-models/${modelId}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                enabled: enabled,
                config: {
                    api_key: apiKey,
                    endpoint: endpoint
                }
            })
        });
        
        const result = await response.json();
        if (result.success) {
            // 保存成功后，更新显示和原始值
            if (apiKey) {
                // 如果有API Key，保存到原始值并显示为***
                apiKeyInput.dataset.originalValue = apiKey;
                if (apiKeyInput.type === 'text') {
                    // 如果当前是明文显示，切换为密码显示
                    apiKeyInput.value = '***';
                    apiKeyInput.type = 'password';
                    const icon = document.getElementById(`api-key-icon-${modelId}`);
                    if (icon) {
                        icon.textContent = '👁';
                    }
                } else {
                    // 如果当前是密码显示，保持***
                    apiKeyInput.value = '***';
                }
            } else {
                // 如果API Key为空，清空显示和原始值
                apiKeyInput.value = '';
                apiKeyInput.dataset.originalValue = '';
            }
            console.log(`✅ 配置已自动保存: ${modelId} (enabled: ${enabled}, endpoint: ${endpoint ? '已设置' : '未设置'}, apiKey: ${apiKey ? '已设置' : '未设置'})`);
        } else {
            console.error('❌ 自动保存失败:', result.error);
        }
    } catch (error) {
        console.error('❌ 自动保存失败:', error);
    } finally {
        isSaving[modelId] = false;
    }
}

function toggleApiKeyVisibility(modelId) {
    const input = document.getElementById(`api-key-${modelId}`);
    const icon = document.getElementById(`api-key-icon-${modelId}`);
    if (input && icon) {
        if (input.type === 'password') {
            // 显示明文
            if (input.value === '***' && input.dataset.originalValue) {
                // 如果显示的是***，显示原始值
                input.value = input.dataset.originalValue;
            }
            input.type = 'text';
            icon.textContent = '🙈';
        } else {
            // 隐藏为密码
            if (input.value && input.value !== '***') {
                // 保存当前值到原始值
                input.dataset.originalValue = input.value;
                input.value = '***';
            }
            input.type = 'password';
            icon.textContent = '👁';
        }
    }
}

    try {
        const response = await fetch(`/api/settings/ai-models/${modelId}/models`);
        const result = await response.json();
        
        if (result.success) {
            if (result.data && result.data.models && result.data.models.length > 0) {

            listDiv.innerHTML = `<p style="color: #dc2626; text-align: center; padding: 20px;">${errorMsg}</p>`;

function renderModelManageList(models, modelId) {
    if (!models || models.length === 0) {
        return '<p style="color: var(--muted); text-align: center; padding: 20px;">暂无模型</p>';
    }
    
    const selectedModels = selectedModelsCache[modelId] || [];
    
    return models.map(model => {
        const modelIdStr = model.id || model.name || '';
        const modelName = model.name || model.id || '';
        const isSelected = selectedModels.includes(modelIdStr);
        const contextInfo = model.context || '';
        
        // 格式化context信息（如32K）
        const contextDisplay = contextInfo ? `<span style="font-size: 12px; color: var(--muted); margin-left: 8px;">${contextInfo}</span>` : '';
        
        return `
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; background: #fff; transition: background 0.2s;">

                    style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 1px solid ${isSelected ? '#dc2626' : '#2563eb'}; border-radius: 6px; background: ${isSelected ? '#fee2e2' : '#f0f9ff'}; color: ${isSelected ? '#dc2626' : '#2563eb'}; cursor: pointer; font-size: 20px; font-weight: bold; transition: all 0.2s;"

async function addModelToList(modelId, modelIdStr, modelName) {
    if (!selectedModelsCache[modelId]) {
        selectedModelsCache[modelId] = [];
    }
    
    if (!selectedModelsCache[modelId].includes(modelIdStr)) {
        selectedModelsCache[modelId].push(modelIdStr);
        console.log(`[DEBUG] 添加模型: ${modelIdStr} 到 ${modelId}, 当前列表:`, selectedModelsCache[modelId]);
        
        // 实时保存到数据库
        await saveSelectedModels(modelId);
        
        // 更新显示
        const listDiv = document.getElementById(`manage-model-list-${modelId}`);
        if (listDiv && modelListCache[modelId]) {
            listDiv.innerHTML = renderModelManageList(modelListCache[modelId], modelId);
        }
        
        // 更新配置页面的模型列表显示
        updateConfigModelList(modelId);
    }
}

async function removeModelFromList(modelId, modelIdStr) {
    if (selectedModelsCache[modelId]) {
        selectedModelsCache[modelId] = selectedModelsCache[modelId].filter(id => id !== modelIdStr);
        
        // 实时保存到数据库
        await saveSelectedModels(modelId);
        
        // 更新显示
        const listDiv = document.getElementById(`manage-model-list-${modelId}`);
        if (listDiv && modelListCache[modelId]) {
            listDiv.innerHTML = renderModelManageList(modelListCache[modelId], modelId);
        }
        
        // 更新配置页面的模型列表显示
        updateConfigModelList(modelId);
    }
}

// 从数据库加载已保存的模型列表
async function loadSelectedModels(modelId) {
    try {
        const response = await fetch(`/api/settings/ai-models`);
        const result = await response.json();
        
        if (result.success && result.data && result.data.models) {
            const modelConfig = result.data.models.find(m => m.id === modelId);
            if (modelConfig && modelConfig.config) {
                // 加载选中的模型列表
                selectedModelsCache[modelId] = modelConfig.config.selected_models || [];
                
                // 加载模型配置信息
                if (modelConfig.config.model_configs) {
                    modelConfigCache[modelId] = modelConfig.config.model_configs;
                } else {
                    modelConfigCache[modelId] = {};
                }
            } else {
                selectedModelsCache[modelId] = [];
                modelConfigCache[modelId] = {};
            }
        } else {
            selectedModelsCache[modelId] = [];
            modelConfigCache[modelId] = {};
        }
    } catch (error) {
        console.error('加载已保存的模型列表失败:', error);
        selectedModelsCache[modelId] = [];
    }
}

// 保存选中的模型列表到数据库
async function saveSelectedModels(modelId) {
    try {
        console.log(`[DEBUG] 开始保存模型列表: ${modelId}`, selectedModelsCache[modelId]);
        
        // 获取当前的配置（enabled和config）
        const response = await fetch(`/api/settings/ai-models`);
        const result = await response.json();
        
        let enabled = false;
        let config = {};
        
        if (result.success && result.data && result.data.models) {
            const modelConfig = result.data.models.find(m => m.id === modelId);
            if (modelConfig) {
                enabled = modelConfig.enabled || false;
                config = JSON.parse(JSON.stringify(modelConfig.config || {})); // 深拷贝
                console.log(`[DEBUG] 当前配置 - enabled: ${enabled}, config keys:`, Object.keys(config));
            } else {
                console.log(`[DEBUG] 未找到模型配置，将创建新配置`);
            }
        }
        
        // 将选中的模型列表添加到config中
        config.selected_models = selectedModelsCache[modelId] || [];
        
        // 将模型配置信息添加到config中
        if (!config.model_configs) {
            config.model_configs = {};
        }
        if (modelConfigCache[modelId]) {
            // 合并模型配置
            Object.assign(config.model_configs, modelConfigCache[modelId]);
        }
        
        console.log(`[DEBUG] 准备保存的配置:`, {
            enabled: enabled,
            config: config,
            selected_models: config.selected_models,
            model_configs: config.model_configs
        });
        
        // 保存选中的模型列表
        const saveResponse = await fetch(`/api/settings/ai-models/${modelId}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                enabled: enabled,
                config: config
            })
        });
        
        const saveResult = await saveResponse.json();
        console.log(`[DEBUG] 保存响应:`, saveResult);
        
        if (saveResult.success) {
            console.log(`✅ 模型列表已保存: ${modelId} (${(selectedModelsCache[modelId] || []).length}个模型)`);
        } else {
            console.error('❌ 保存模型列表失败:', saveResult.error);
        }
    } catch (error) {
        console.error('❌ 保存模型列表失败:', error);
        console.error('错误详情:', error.stack);
    }
}

// 切换配置开关
function toggleConfigSwitch(switchId) {

}

// 保存模型配置
async function saveModelConfig(modelId, modelIdStr) {
    const nameInput = document.getElementById(`config-model-name-${modelId}-${modelIdStr}`);
    const tokensInput = document.getElementById(`config-model-tokens-${modelId}-${modelIdStr}`);
    const visionToggle = document.getElementById(`config-model-vision-${modelId}-${modelIdStr}`);
    const toolsToggle = document.getElementById(`config-model-tools-${modelId}-${modelIdStr}`);
    
    if (!nameInput || !tokensInput) {
        alert('请填写完整信息');
        return;
    }
    
    const name = nameInput.value.trim();
    let tokens = tokensInput.value.trim();
    const vision = visionToggle ? visionToggle.classList.contains('active') : false;
    const tools = toolsToggle ? toolsToggle.classList.contains('active') : false;
    
    if (!name) {
        alert('请输入模型显示名称');
        return;
    }
    
    // 如果Token为空，使用默认值32K
    if (!tokens) {
        tokens = '32';
    }
    
    if (parseInt(tokens) <= 0) {
        alert('请输入有效的最大Token数');
        return;
    }
    
    // 保存到缓存
    if (!modelConfigCache[modelId]) {
        modelConfigCache[modelId] = {};
    }
    modelConfigCache[modelId][modelIdStr] = {
        name: name,
        context: `${tokens}K`,
        vision: vision,
        tools: tools
    };
    
    // 保存到数据库
    await saveSelectedModels(modelId);
    
    // 更新显示
    const listDiv = document.getElementById(`manage-model-list-${modelId}`);
    if (listDiv && modelListCache[modelId]) {
        listDiv.innerHTML = renderModelManageList(modelListCache[modelId], modelId);
    }
    
    // 更新配置页面的模型列表显示
    updateConfigModelList(modelId);
    
    // 关闭对话框
    const modal = document.querySelector('.model-config-modal');
    if (modal) {
        modal.remove();
    }
    
    console.log(`✅ 模型配置已保存: ${modelIdStr}`);
}

// 端口和协议联动函数
function updatePortByEncryption() {
    const encryption = document.getElementById('encryption')?.value;
    const portInput = document.getElementById('smtp_port');
    
    if (!portInput) return;
    
    // 根据协议自动设置端口
    const portMap = {
        'SSL': '465',
        'TLS': '587',
        'NONE': '25'
    };
    
    if (encryption && portMap[encryption]) {
        portInput.value = portMap[encryption];
    }
}

function updateEncryptionByPort() {
    const portInput = document.getElementById('smtp_port');
    const encryptionSelect = document.getElementById('encryption');
    
    if (!portInput || !encryptionSelect) return;
    
    const port = parseInt(portInput.value);
    
    // 根据端口自动设置协议
    if (port === 465) {
        encryptionSelect.value = 'SSL';
    } else if (port === 587) {
        encryptionSelect.value = 'TLS';
    } else if (port === 25) {
        encryptionSelect.value = 'NONE';
    }
    // 其他端口不自动更改协议，让用户手动选择
}

                </div>
                <div style="color: var(--text); font-size: 14px; line-height: 1.6; margin-bottom: 16px;">${message}</div>
                <input 
                    type="text" 
                    id="input-modal-input"

                    autofocus
                />
                <div style="display: flex; justify-content: flex-end; gap: 12px;">
                    <button class="button secondary" onclick="
                        const modal = this.closest('.custom-input-modal');
                        window.__inputModalResolve(null);
                        modal.remove();
                    " style="padding: 10px 20px;">取消</button>
                    <button class="button primary" onclick="
                        const modal = this.closest('.custom-input-modal');
                        const input = document.getElementById('input-modal-input');
                        window.__inputModalResolve(input ? input.value.trim() : '');
                        modal.remove();
                    " style="padding: 10px 20px;">确定</button>
                </div>
            </div>
        `;
        
        document.body.appendChild(modal);
        
        // 设置全局resolve函数
        window.__inputModalResolve = resolve;
        
        // 回车键确认
        const input = modal.querySelector('#input-modal-input');
        if (input) {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {

                }
            });
            input.focus();
        }
        
        // 点击背景关闭
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                window.__inputModalResolve(null);
                modal.remove();
            }
        });
    });
}

// 邮件配置相关函数
async function testEmail() {
    const smtpHost = document.getElementById('smtp_host')?.value.trim();
    const smtpPort = document.getElementById('smtp_port')?.value.trim();
    const encryption = document.getElementById('encryption')?.value;
    const senderEmail = document.getElementById('sender_email')?.value.trim();
    const authCodeInput = document.getElementById('auth_code');
    let authCode = authCodeInput?.value || '';
    
    // 如果显示的是***，使用原始值
    if (authCode === '***' && authCodeInput?.dataset.originalValue) {
        authCode = authCodeInput.dataset.originalValue;
    }
    
    // 验证必填字段
    if (!smtpHost || !smtpPort || !senderEmail || !authCode) {
        showModal('配置不完整', '请填写完整的邮件配置信息', 'warning');
        return;
    }
    
    // 验证邮箱格式
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(senderEmail)) {
        showModal('邮箱格式错误', '发件人邮箱格式不正确', 'error');
        return;
    }
    
    // 获取测试收件人邮箱（使用自定义弹窗）
    const recipient = await showInputModal('测试邮件', '请输入测试邮件接收邮箱:', senderEmail, '例如: test@example.com');
    if (!recipient) {
        return;
    }
    
    if (!emailRegex.test(recipient)) {
        showModal('邮箱格式错误', '收件人邮箱格式不正确', 'error');
        return;
    }
    
    // 显示加载弹窗
    const closeLoading = showLoadingModal('发送中', '正在发送测试邮件，请稍候...');
    
    try {
        // 先保存配置，确保Flask-Mail配置已更新
        const saveResult = await saveEmailConfig();
        if (!saveResult.success) {
            closeLoading();
            showModal('保存失败', '保存配置失败，无法发送测试邮件:\n' + (saveResult.error || '未知错误'), 'error');
            return;
        }
        
        // 发送测试邮件
        const testBtn = document.querySelector('button[onclick="testEmail()"]');
        const originalText = testBtn?.textContent || '发送测试邮件';
        if (testBtn) {
            testBtn.disabled = true;
            testBtn.textContent = '发送中...';
        }
        
        const response = await fetch('/api/settings/email/test', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                recipient: recipient,
                sender_email: senderEmail  // 传递发件人邮箱
            })
        });
        
        const result = await response.json();
        
        // 关闭加载弹窗
        closeLoading();
        
        // 显示结果
        if (result.success) {
            showModal('发送成功', `测试邮件已发送成功！\n\n收件人: ${recipient}\n发件人: ${senderEmail}\n\n请查收邮箱。`, 'success');
        } else {
            showModal('发送失败', result.error || '未知错误', 'error');
        }
    } catch (error) {
        console.error('发送测试邮件失败:', error);
        closeLoading();
        showModal('网络错误', '发送测试邮件失败，请检查网络连接', 'error');
    } finally {
        const testBtn = document.querySelector('button[onclick="testEmail()"]');
        if (testBtn) {
            testBtn.disabled = false;
            testBtn.textContent = '发送测试邮件';
        }
    }
}

async function saveEmailConfig() {
    const smtpHost = document.getElementById('smtp_host')?.value.trim();
    const smtpPort = document.getElementById('smtp_port')?.value.trim();
    const encryption = document.getElementById('encryption')?.value;
    const senderEmail = document.getElementById('sender_email')?.value.trim();
    const authCodeInput = document.getElementById('auth_code');
    let authCode = authCodeInput?.value || '';
    
    // 如果显示的是***，使用原始值
    if (authCode === '***' && authCodeInput?.dataset.originalValue) {
        authCode = authCodeInput.dataset.originalValue;
    } else if (authCode && authCode !== '***') {
        // 更新原始值
        authCodeInput.dataset.originalValue = authCode;
    }
    
    // 验证必填字段
    if (!smtpHost || !smtpPort || !senderEmail || !authCode) {
        return {
            success: false,
            error: '请填写完整的邮件配置信息'
        };
    }
    
    // 验证邮箱格式
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(senderEmail)) {
        return {
            success: false,
            error: '发件人邮箱格式不正确'
        };
    }
    
    try {
        const response = await fetch('/api/settings/email', {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                provider: 'custom',
                enabled: true,
                config: {
                    smtp_host: smtpHost,
                    smtp_port: parseInt(smtpPort),
                    encryption: encryption,
                    sender_email: senderEmail,
                    auth_code: authCode
                }
            })
        });
        
        const result = await response.json();
        
        if (result.success) {
            // 保存成功后，更新显示
            if (authCodeInput) {
                authCodeInput.dataset.originalValue = authCode;
                authCodeInput.value = '***';
                authCodeInput.type = 'password';
            }
            console.log('✅ 邮件配置已保存');
        }
        
        return result;
    } catch (error) {
        console.error('保存邮件配置失败:', error);
        return {
            success: false,
            error: '保存失败: ' + (error.message || '未知错误')
        };
    }
}

async function toggleAdminStatus(adminId) {
    // 先获取当前状态
    const response = await fetch(`/api/settings/admins`);
    const result = await response.json();
    
    if (!result.success) {
        showModal('错误', '获取管理员信息失败', 'error');
        return;
    }
    
    const admin = result.data.admins.find(a => a.id === adminId);
    if (!admin) {
        showModal('错误', '未找到该管理员', 'error');
        return;
    }
    
    const currentStatus = admin.status;
    const newStatus = currentStatus === 'active' ? 'disabled' : 'active';
    const action = newStatus === 'disabled' ? '禁用' : '启用';
    
    const confirmed = await new Promise((resolve) => {
        const modal = document.createElement('div');
        modal.className = 'custom-modal';

                    <h3 style="margin: 0; font-size: 18px; font-weight: 600; color: ${newStatus === 'disabled' ? '#dc2626' : '#10b981'};">
                        ${newStatus === 'disabled' ? '⚠️ 确认禁用' : '✅ 确认启用'}

                    <div style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); font-size: 20px;" onclick="this.closest('.custom-modal').remove(); window.__confirmToggleResolve(false);">✕</div>

                        确认${action}

                </div>
            </div>
        `;
        
        document.body.appendChild(modal);
        window.__confirmToggleResolve = resolve;
    });
    
    if (!confirmed) {
        return;
    }
    
    // 显示加载弹窗
    const closeLoading = showLoadingModal('处理中', `正在${action}管理员...`);
    
    try {
        const response = await fetch(`/api/settings/admins/${adminId}/toggle-status`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        });
        
        const result = await response.json();
        
        closeLoading();
        
        if (result.success) {
            showModal('操作成功', result.data?.message || `管理员已${action}`, 'success');
            // 重新加载管理员列表
            await loadTabContent('admin');
        } else {
            showModal('操作失败', result.error || '未知错误', 'error');
        }
    } catch (error) {
        closeLoading();
        console.error(`${action}管理员失败:`, error);
        showModal('网络错误', `${action}管理员失败，请检查网络连接`, 'error');

// 操作日志相关函数
let currentLogPage = 1;
let currentLogPageSize = 20;
let currentLogKeyword = '';

async function loadLogsPage(page, pageSize = null, keyword = null) {
    try {
        currentLogPage = page;
        if (pageSize !== null) {
            currentLogPageSize = pageSize;
        }
        if (keyword !== null) {
            currentLogKeyword = keyword;
        }
        
        const params = new URLSearchParams({
            page: currentLogPage,
            page_size: currentLogPageSize
        });
        
        if (currentLogKeyword) {
            params.append('keyword', currentLogKeyword);
        }
        
        const response = await fetch(`/api/settings/logs?${params.toString()}`);
        const result = await response.json();
        
        if (result.success) {
            const contentDiv = document.getElementById('logs-content');
            contentDiv.innerHTML = renderLogs(result.data.logs, result.data.pagination);
        } else {
            const contentDiv = document.getElementById('logs-content');
            contentDiv.innerHTML = '<p style="color: #dc2626;">加载日志失败，请刷新重试</p>';
        }
    } catch (error) {
        console.error('加载日志失败:', error);
        const contentDiv = document.getElementById('logs-content');
        contentDiv.innerHTML = '<p style="color: #dc2626;">加载日志失败，请刷新重试</p>';
    }
}

function searchLogs() {
    const keyword = document.getElementById('log-keyword')?.value.trim() || '';
    loadLogsPage(1, null, keyword);
}

function changeLogPageSize() {
    const pageSize = parseInt(document.getElementById('log-page-size')?.value || '20');
    loadLogsPage(1, pageSize, null);
}

// 获取当前用户ID（从后端获取）
async function getCurrentUserId() {
    // 如果已经获取过，直接返回
    if (window.currentUserId) {
        return window.currentUserId;
    }
    
    try {
        const response = await fetch('/api/auth/me');
        if (response.ok) {
            const result = await response.json();
            if (result.success && result.data && result.data.id) {
                window.currentUserId = result.data.id;
                return result.data.id;
            }
        }
    } catch (error) {
        console.error('获取当前用户ID失败:', error);
    }
    
    // 如果获取失败，返回null（不影响功能，只是不能禁用自己）
    return null;
}

// 绑定表单提交事件
document.addEventListener('DOMContentLoaded', async function() {
    // 获取当前用户ID
    await getCurrentUserId();
    
    // 加载第一个tab
    loadTabContent('model');
    
    // 监听邮件表单提交
    document.addEventListener('submit', async function(e) {
        if (e.target && e.target.id === 'email-form') {

            const result = await saveEmailConfig();

            } else {
                showModal('保存失败', result.error || '未知错误', 'error');
            }
        }
    });
});
