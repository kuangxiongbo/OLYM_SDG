{% extends "base_new.html" %}

{% block title %}系统设置{% endblock %}

{% block extra_css %}
<style>
.tab-menu {
    display: flex;
    gap: 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
    padding: 0 12px;
}
.tab-menu button {
    position: relative;
    padding: 12px 0;
    border: none;
    background: transparent;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.2s ease;
    flex: 1;
    text-align: center;
}
.tab-menu button.active {
    color: var(--primary);
}
.tab-menu button::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    height: 3px;
    background: transparent;
    transition: background 0.2s ease;
}
.tab-menu button.active::after {
    background: linear-gradient(90deg, rgba(37,99,235,0.2), var(--primary), rgba(37,99,235,0.2));
}
.tab-content [data-tab] {
    display: none;
}
.tab-content [data-tab].active {
    display: block;
}
.model-service-item, .mail-provider-item {
    padding: 12px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.2s;
    margin-bottom: 8px;
}
.model-service-item:hover, .mail-provider-item:hover {
    background: #f8fafc;
}
.model-service-item.active, .mail-provider-item.active {
    background: #f1f5f9;
    border-color: var(--primary);
}
.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #94a3b8;
}
.status-dot.active {
    background: #10b981;
}
.toggle-switch {
    width: 44px;
    height: 24px;
    border-radius: 12px;
    background: var(--border);
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
}
.toggle-switch.active {
    background: var(--primary);
}
.toggle-switch::after {
    content: "";
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    position: absolute;
    left: 2px;
    top: 2px;
    transition: transform 0.2s;
}
.toggle-switch.active::after {
    transform: translateX(20px);
}
.form-group {
    margin-bottom: 18px;
}
.form-label {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 6px;
    display: block;
}
.form-input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 14px;
    color: var(--text);
}
.form-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}
.checkbox-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    cursor: pointer;
}
.checkbox-item input[type="checkbox"] {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    border: 2px solid var(--border);
    cursor: pointer;
}
.checkbox-item input[type="checkbox"]:checked {
    background: var(--primary);
    border-color: var(--primary);
}
</style>
{% endblock %}

{% block content %}
<section class="section">
    <div class="tab-menu">
        <button class="active" data-tab-target="model" onclick="switchTab('model')">AI 大模型配置</button>
        <button data-tab-target="mail" onclick="switchTab('mail')">邮箱服务器配置</button>
        <button data-tab-target="admin" onclick="switchTab('admin')">管理员管理</button>
        <button data-tab-target="logs" onclick="switchTab('logs')">操作日志</button>
    </div>
    <div class="panel">
        <div class="tab-content">
            <!-- AI 大模型配置 -->
            <div data-tab="model" class="active">
                <div id="model-content">
                    <p>加载中...</p>
                </div>
            </div>
            
            <!-- 邮箱服务器配置 -->
            <div data-tab="mail">
                <div id="mail-content">
                    <p>加载中...</p>
                </div>
            </div>
            
            <!-- 管理员管理 -->
            <div data-tab="admin">
                <div id="admin-content">
                    <p>加载中...</p>
                </div>
            </div>
            
            <!-- 操作日志 -->
            <div data-tab="logs">
                <div id="logs-content">
                    <p>加载中...</p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
let currentTab = 'model';
let selectedModelService = null;
let selectedMailProvider = null;
let saveConfigTimers = {};

// 模型服务列表（按照原型）
const modelServices = [
    {id: 'ollama', name: 'Ollama', icon: '🦙'},
    {id: 'tongyi', name: '通义千问', icon: '⭐'},
    {id: 'openai', name: 'OpenAI', icon: '⚫'},
    {id: 'claude', name: 'Claude', icon: '⭐'},
    {id: 'gemini', name: 'Gemini', icon: '💎'},
    {id: 'deepseek', name: 'Deepseek', icon: '🐋'},
    {id: 'moonshot', name: 'Moonshot', icon: '🌙'},
    {id: 'doubao', name: '火山方舟(豆包)', icon: '⛰️'},
    {id: 'qianfan', name: '百度云千帆', icon: '🔷'},
    {id: 'grok', name: 'Grok', icon: '❌'},
    {id: 'hunyuan', name: '腾讯混元', icon: '🌀'},
    {id: 'openrouter', name: 'OpenRouter', icon: '⇄'},
    {id: 'zhipu', name: '智谱', icon: '🔵'}
];

// 邮箱服务商列表（按照原型）
const mailProviders = [
    {id: 'qq', name: 'QQ邮箱', icon: '📧'},
    {id: '163', name: '163邮箱', icon: '📧'},
    {id: 'gmail', name: 'Gmail', icon: '📧'},
    {id: 'outlook', name: 'Outlook', icon: '📧'},
    {id: 'sina', name: '新浪邮箱', icon: '📧'},
    {id: 'custom', name: '自定义', icon: '⚙️'}
];

function switchTab(tab) {
    currentTab = tab;
    // 更新tab按钮状态
    document.querySelectorAll('.tab-menu button').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.tabTarget === tab) {
            btn.classList.add('active');
        }
    });
    // 更新内容显示
    document.querySelectorAll('.tab-content [data-tab]').forEach(content => {
        content.classList.remove('active');
        if (content.dataset.tab === tab) {
            content.classList.add('active');
        }
    });
    // 加载对应内容
    loadTabContent(tab);
}

async function loadTabContent(tab) {
    const contentDiv = document.getElementById(`${tab}-content`);
    
    try {
        let response, result;
        
        if (tab === 'model') {
            response = await fetch('/api/settings/ai-models', {
                credentials: 'include',
                headers: {
                    'Accept': 'application/json'
                }
            });
            
            if (!response.ok) {
                let errorText = `HTTP ${response.status}: ${response.statusText}`;
                try {
                    const errorResult = await response.json();
                    errorText = errorResult.error || errorText;
                } catch {
                    // 如果不是JSON响应，使用默认错误
                }
                const error = new Error(errorText);
                error.status = response.status;
                throw error;
            }
            
            result = await response.json();
            if (result.success) {
                renderModelConfig(result.data.models || []);
            } else {
                renderModelConfig([]);
            }
        } else if (tab === 'mail') {
            response = await fetch('/api/settings/email', {
                credentials: 'include',
                headers: {
                    'Accept': 'application/json'
                }
            });
            
            if (!response.ok) {
                let errorText = `HTTP ${response.status}: ${response.statusText}`;
                try {
                    const errorResult = await response.json();
                    errorText = errorResult.error || errorText;
                } catch {
                    // 如果不是JSON响应，使用默认错误
                }
                const error = new Error(errorText);
                error.status = response.status;
                throw error;
            }
            
            result = await response.json();
            if (result.success) {
                renderEmailConfig(result.data || {});
            } else {
                renderEmailConfig({});
            }
        } else if (tab === 'admin') {
            response = await fetch('/api/settings/admins', {
                credentials: 'include',
                headers: {
                    'Accept': 'application/json'
                }
            });
            
            if (!response.ok) {
                let errorText = `HTTP ${response.status}: ${response.statusText}`;
                try {
                    const errorResult = await response.json();
                    errorText = errorResult.error || errorText;
                } catch {
                    // 如果不是JSON响应，使用默认错误
                }
                const error = new Error(errorText);
                error.status = response.status;
                throw error;
            }
            
            result = await response.json();
            if (result.success) {
                renderAdminList(result.data.admins || []);
            } else {
                renderAdminList([]);
            }
        } else if (tab === 'logs') {
            response = await fetch('/api/settings/logs', {
                credentials: 'include',
                headers: {
                    'Accept': 'application/json'
                }
            });
            
            if (!response.ok) {
                let errorText = `HTTP ${response.status}: ${response.statusText}`;
                try {
                    const errorResult = await response.json();
                    errorText = errorResult.error || errorText;
                } catch {
                    // 如果不是JSON响应，使用默认错误
                }
                const error = new Error(errorText);
                error.status = response.status;
                throw error;
            }
            
            result = await response.json();
            if (result.success) {
                renderLogs(result.data.logs || [], result.data.pagination || {});
            } else {
                renderLogs([], {});
            }
        }
    } catch (error) {
        console.error('加载失败:', error);
        const errorMsg = error.message || '未知错误';
        const status = error.status || 0;
        
        // 检查是否是权限错误
        if (status === 401 || status === 403 || errorMsg.includes('权限') || errorMsg.includes('登录')) {
            contentDiv.innerHTML = `
                <div style="padding: 20px; text-align: center;">
                    <p style="color: #dc2626; margin-bottom: 12px;">权限不足，请确保已登录且拥有管理员权限</p>
                    <button class="button secondary" onclick="window.location.href='/auth/login'">前往登录</button>
                </div>
            `;
        } else {
            contentDiv.innerHTML = `
                <div style="padding: 20px; text-align: center;">
                    <p style="color: #dc2626; margin-bottom: 12px;">加载失败：${errorMsg}</p>
                    <button class="button secondary" onclick="loadTabContent('${tab}')">重试</button>
                </div>
            `;
        }
    }
}

function renderModelConfig(models) {
    const contentDiv = document.getElementById('model-content');
    
    // 创建模型服务映射
    modelMap = {};
    models.forEach(m => {
        modelMap[m.id] = m;
    });
    
    // 默认选择第一个
    if (!selectedModelService && modelServices.length > 0) {
        selectedModelService = modelServices[0].id;
    }
    
    const selectedModel = modelMap[selectedModelService] || {enabled: false, config: {}};
    
    contentDiv.innerHTML = `
        <div class="grid" style="grid-template-columns: 280px 1fr; gap: 24px;">
            <div style="background: #f8fafc; border-radius: 12px; padding: 16px; border: 1px solid var(--border); max-height: 600px; overflow-y: auto;">
                <h3 style="margin: 0 0 16px 0; font-size: 16px;">模型服务</h3>
                <div class="grid" style="gap: 8px;">
                    ${modelServices.map(service => {
                        const model = modelMap[service.id] || {enabled: false};
                        const isActive = selectedModelService === service.id;
                        const isEnabled = model.enabled;
                        return `
                            <div class="model-service-item ${isActive ? 'active' : ''}" 
                                 data-service="${service.id}" 
                                 onclick="selectModelService('${service.id}')"
                                 style="${isActive ? 'background: #f1f5f9; border-color: var(--primary);' : ''}">
                                <div style="width: 32px; height: 32px; border-radius: 50%; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 18px;">${service.icon}</div>
                                <div style="flex: 1; font-weight: 500;">${service.name}</div>
                                <div class="status-dot ${isEnabled ? 'active' : ''}"></div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
            <div>
                ${renderModelDetail(selectedModelService, selectedModel)}
            </div>
        </div>
    `;
    
    // 渲染后加载模型列表
    setTimeout(() => {
        if (selectedModelService) {
            loadModelList(selectedModelService);
        }
    }, 200);
}

function renderModelDetail(serviceId, model) {
    const service = modelServices.find(s => s.id === serviceId);
    if (!service) return '<p style="color: var(--muted);">请选择一个模型服务进行配置</p>';
    
    const config = model.config || {};
    const apiKey = config.api_key || '';
    const endpoint = config.endpoint || getDefaultEndpoint(serviceId);
    // 从后端获取的启用状态，默认为false（关闭）
    const enabled = model.enabled === true;
    
    // 对于Ollama，API Key是可选的
    const isOllama = serviceId === 'ollama';
    const apiKeyPlaceholder = isOllama ? '可选，Ollama通常不需要API Key' : '请输入API Key';
    
    // 使用本地状态，默认为false（关闭），只有明确设置为true时才启用
    // 如果本地状态已设置，使用本地状态；否则使用服务器返回的状态
    const localEnabled = localModelEnabledState[serviceId] !== undefined 
        ? localModelEnabledState[serviceId] 
        : enabled;
    
    return `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="margin: 0;">${service.name}</h3>
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 12px; color: var(--muted);">启用状态</span>
                <div class="toggle-switch ${localEnabled === true ? 'active' : ''}" onclick="toggleModelEnabledUI('${serviceId}')" style="cursor: pointer;" id="toggle-switch-${serviceId}"></div>
            </div>
        </div>
        <div class="grid" style="gap: 18px;">
            <div>
                <div style="font-size: 14px; color: var(--muted); margin-bottom: 6px;">API Key ${isOllama ? '<span style="color: #94a3b8; font-size: 12px;">(可选)</span>' : ''}</div>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <input type="password" class="form-input" id="api-key-${serviceId}" value="${apiKey ? '***' : ''}" placeholder="${apiKeyPlaceholder}" data-original-value="${apiKey || ''}" ${!localEnabled ? 'disabled' : ''} style="${!localEnabled ? 'opacity: 0.6; cursor: not-allowed;' : ''}" oninput="handleModelFieldChange('${serviceId}')">
                    <div style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: ${localEnabled ? 'pointer' : 'not-allowed'}; opacity: ${localEnabled ? '1' : '0.6'};" onclick="${localEnabled ? `toggleApiKeyVisibility('${serviceId}')` : ''}">👁</div>
                </div>
                <a href="#" style="color: var(--primary); font-size: 13px; text-decoration: none; margin-top: 6px; display: inline-block; ${!localEnabled ? 'pointer-events: none; opacity: 0.6;' : ''}">设置指引</a>
            </div>
            <div>
                <div style="font-size: 14px; color: var(--muted); margin-bottom: 6px;">API Endpoint</div>
                <input type="text" class="form-input" id="endpoint-${serviceId}" value="${endpoint}" placeholder="请输入API Endpoint" oninput="handleEndpointInput('${serviceId}')" ${!localEnabled ? 'disabled' : ''} style="${!localEnabled ? 'opacity: 0.6; cursor: not-allowed;' : ''}">
                <div style="font-size: 12px; color: var(--muted); margin-top: 6px; ${!localEnabled ? 'opacity: 0.6;' : ''}" id="endpoint-preview-${serviceId}">${getEndpointPreview(serviceId, endpoint)}</div>
            </div>
            <div>
                <div style="font-size: 14px; color: var(--muted); margin-bottom: 6px;">连通性检查</div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <button class="button secondary" id="test-connection-${serviceId}" onclick="testModelConnection('${serviceId}')" ${!localEnabled ? 'disabled' : ''} style="${!localEnabled ? 'opacity: 0.6; cursor: not-allowed;' : ''}">检查</button>
                    <div id="test-result-${serviceId}" style="font-size: 14px; display: flex; align-items: center; gap: 6px;"></div>
                </div>
            </div>
            <div>
                <div style="font-size: 14px; color: var(--muted); margin-bottom: 12px;">模型列表</div>
                <div id="model-list-${serviceId}" style="margin-bottom: 12px;">
                    <p style="color: var(--muted); font-size: 12px;">点击"管理模型"获取模型列表</p>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="button secondary" style="font-size: 12px; padding: 8px 16px;" id="manage-models-btn-${serviceId}" onclick="manageModels('${serviceId}')" ${!localEnabled ? 'disabled' : ''} style="${!localEnabled ? 'opacity: 0.6; cursor: not-allowed;' : ''}">管理模型</button>
                </div>
            </div>
        </div>
    `;
}

function getDefaultEndpoint(serviceId) {
    const endpoints = {
        'tongyi': 'https://dashscope.aliyuncs.com/compatible-mode/v1',
        'openai': 'https://api.openai.com/v1',
        'claude': 'https://api.anthropic.com/v1',
        'gemini': 'https://generativelanguage.googleapis.com/v1',
        'deepseek': 'https://api.deepseek.com/v1',
        'moonshot': 'https://api.moonshot.cn/v1',
        'doubao': 'https://ark.cn-beijing.volces.com/api/v3',
        'qianfan': 'https://aip.baidubce.com/rpc/2.0/ai_custom/v1',
        'hunyuan': 'https://hunyuan.tencentcloudapi.com',
        'zhipu': 'https://open.bigmodel.cn/api/paas/v4',
        'ollama': 'http://localhost:11434/v1'
    };
    return endpoints[serviceId] || '';
}

function getChatEndpoint(serviceId, baseEndpoint) {
    if (!baseEndpoint) return '';
    
    const endpoint = baseEndpoint.trim().replace(/\/$/, '');
    
    if (serviceId === 'ollama') {
        // Ollama: 完全按用户输入的基础路径来拼接，不做 /v1 等版本号假设
        // 无论是否包含 /v1、/v2…，都只是简单追加 /chat/completions
        return `${endpoint}/chat/completions`;
    } else if (serviceId === 'claude') {
        return `${endpoint}/v1/messages`;
    } else if (serviceId === 'gemini') {
        return `${endpoint}/models/gemini-pro:generateContent`;
    } else {
        // OpenAI兼容格式：如果输入地址已经包含版本号，直接加 /chat/completions
        // 如果没有版本号，默认添加 /v1/chat/completions
        const versionMatch = endpoint.match(/\/(v\d+)$/);
        if (versionMatch) {
            return `${endpoint}/chat/completions`;
        } else {
            return `${endpoint}/v1/chat/completions`;
        }
    }
}

function getEndpointPreview(serviceId, baseEndpoint) {
    if (!baseEndpoint) return '请输入API Endpoint';
    
    const chatEndpoint = getChatEndpoint(serviceId, baseEndpoint);
    return chatEndpoint || `${baseEndpoint}/chat/completions`;
}

function updateEndpointPreview(serviceId) {
    const endpointInput = document.getElementById(`endpoint-${serviceId}`);
    const previewDiv = document.getElementById(`endpoint-preview-${serviceId}`);
    
    if (endpointInput && previewDiv) {
        const endpoint = endpointInput.value.trim();
        if (!endpoint) {
            previewDiv.textContent = '请输入API Endpoint';
            return;
        }
        const preview = getEndpointPreview(serviceId, endpoint);
        previewDiv.textContent = preview;
        previewDiv.style.color = 'var(--muted)';
    }
}

function selectModelService(serviceId) {
    selectedModelService = serviceId;
    loadTabContent('model');
}

// 本地状态管理：存储每个服务的启用状态（未保存）
let localModelEnabledState = {};

function toggleModelEnabledUI(serviceId) {
    // 更新UI状态，并触发自动保存
    const toggleSwitch = document.getElementById(`toggle-switch-${serviceId}`);
    if (!toggleSwitch) return;
    
    // 获取当前UI状态（active表示启用，蓝色）
    const isActive = toggleSwitch.classList.contains('active');
    // 切换状态：如果当前是启用（active），则切换为未启用（!isActive = false）
    // 如果当前是未启用（!active），则切换为启用（!isActive = true）
    const newEnabled = !isActive;
    const oldEnabled = isActive; // 保存旧状态，用于失败时恢复
    
    // 更新UI：newEnabled为true时添加active类（显示蓝色），为false时移除active类（显示灰色）
    if (newEnabled) {
        toggleSwitch.classList.add('active');
    } else {
        toggleSwitch.classList.remove('active');
    }
    
    // 保存到本地状态
    localModelEnabledState[serviceId] = newEnabled;
    
    // 更新输入框和按钮的启用/禁用状态
    updateFormEnabledState(serviceId, newEnabled);

    // 启用状态变化后，立即保存配置（不延迟）
    saveModelConfig(serviceId, oldEnabled); // 传递旧状态用于失败时恢复
}

function updateFormEnabledState(serviceId, enabled) {
    // 更新API Key输入框
    const apiKeyInput = document.getElementById(`api-key-${serviceId}`);
    if (apiKeyInput) {
        apiKeyInput.disabled = !enabled;
        apiKeyInput.style.opacity = enabled ? '1' : '0.6';
        apiKeyInput.style.cursor = enabled ? 'text' : 'not-allowed';
    }
    
    // 更新Endpoint输入框
    const endpointInput = document.getElementById(`endpoint-${serviceId}`);
    if (endpointInput) {
        endpointInput.disabled = !enabled;
        endpointInput.style.opacity = enabled ? '1' : '0.6';
        endpointInput.style.cursor = enabled ? 'text' : 'not-allowed';
    }
    
    // 更新API Key可见性按钮
    const apiKeyToggle = apiKeyInput?.nextElementSibling;
    if (apiKeyToggle) {
        apiKeyToggle.style.cursor = enabled ? 'pointer' : 'not-allowed';
        apiKeyToggle.style.opacity = enabled ? '1' : '0.6';
    }
    
    // 更新测试连接按钮
    const testBtn = document.getElementById(`test-connection-${serviceId}`);
    if (testBtn) {
        testBtn.disabled = !enabled;
        testBtn.style.opacity = enabled ? '1' : '0.6';
        testBtn.style.cursor = enabled ? 'pointer' : 'not-allowed';
    }
    
    // 更新管理模型按钮
    const manageBtn = document.getElementById(`manage-models-btn-${serviceId}`);
    if (manageBtn) {
        manageBtn.disabled = !enabled;
        manageBtn.style.opacity = enabled ? '1' : '0.6';
        manageBtn.style.cursor = enabled ? 'pointer' : 'not-allowed';
    }
    
    // 更新测试结果区域（只在未启用时清空）

// 简单防抖保存：500ms 内多次改动只触发一次保存
function scheduleSaveModelConfig(serviceId) {

        clearTimeout(saveConfigTimers[serviceId]);

async function testModelConnection(serviceId) {
    const testBtn = document.getElementById(`test-connection-${serviceId}`);
    const manageBtn = document.getElementById(`manage-models-btn-${serviceId}`);
    const testResultDiv = document.getElementById(`test-result-${serviceId}`);
    
    if (testBtn) {
        testBtn.disabled = true;
        testBtn.textContent = '测试中...';
    }
    
    // 显示测试中状态
    if (testResultDiv) {
        testResultDiv.innerHTML = '<span style="color: var(--muted);">正在测试连接...</span>';
    }
    
    try {
        // 仅基于当前输入做连通性测试，不再在这里保存配置
        const endpointInput = document.getElementById(`endpoint-${serviceId}`);
        const apiKeyInput = document.getElementById(`api-key-${serviceId}`);
        
        if (!endpointInput || !endpointInput.value.trim()) {
            if (testResultDiv) {
                testResultDiv.innerHTML = '<span style="color: #ef4444;">✗ 请先填写API Endpoint</span>';
            }
            if (testBtn) {
                testBtn.disabled = false;
                testBtn.textContent = '检查';
            }
            return;
        }
        
        const endpoint = endpointInput.value.trim();
        let apiKey = '';
        
        if (apiKeyInput) {
            apiKey = apiKeyInput.value;
            // 如果API Key显示为***，使用原始值
            if (apiKey === '***' || apiKey === '') {
                const originalValue = apiKeyInput.getAttribute('data-original-value') || '';
                apiKey = originalValue;
            }
        }
        
        // 直接测试连接（传递当前配置），不保存到数据库
        const response = await fetch(`/api/settings/ai-models/${serviceId}/test`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            credentials: 'include',
            body: JSON.stringify({
                endpoint: endpoint,
                api_key: apiKey
            })
        });
        
        const result = await response.json();
        
        if (result.success) {
            const data = result.data || {};
            if (data.connected) {
                // 显示成功消息（绿色对勾图标 + 文字）
                if (testResultDiv) {
                    testResultDiv.innerHTML = `
                        <span style="display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: #10b981; color: white; font-size: 12px; font-weight: bold;">✓</span>
                        <span style="color: #10b981; font-weight: 500;">检查通过</span>
                    `;
                }
                // 启用管理模型按钮
                if (manageBtn) {
                    manageBtn.disabled = false;
                }
            } else {
                // 显示失败消息（红色X图标 + 文字）
                if (testResultDiv) {
                    testResultDiv.innerHTML = `
                        <span style="display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: #ef4444; color: white; font-size: 12px; font-weight: bold;">✗</span>
                        <span style="color: #ef4444;">${data.message || '连接失败'}</span>
                    `;
                }
                if (manageBtn) {
                    manageBtn.disabled = true;
                }
            }
        } else {
            // 显示错误消息
            if (testResultDiv) {
                testResultDiv.innerHTML = `
                    <span style="display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: #ef4444; color: white; font-size: 12px; font-weight: bold;">✗</span>
                    <span style="color: #ef4444;">${result.error || '测试失败'}</span>
                `;
            }
            if (manageBtn) {
                manageBtn.disabled = true;
            }
        }
    } catch (error) {
        console.error('测试连接失败:', error);
        if (testResultDiv) {
            testResultDiv.innerHTML = `
                <span style="display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: #ef4444; color: white; font-size: 12px; font-weight: bold;">✗</span>
                <span style="color: #ef4444;">${error.message || '测试失败'}</span>
            `;
        }
        if (manageBtn) {
            manageBtn.disabled = true;
        }
    } finally {
        if (testBtn) {
            testBtn.disabled = false;
            testBtn.textContent = '检查';
        }
    }
}

async function saveModelConfig(serviceId, oldEnabled = null) {
    const apiKeyInput = document.getElementById(`api-key-${serviceId}`);
    const endpointInput = document.getElementById(`endpoint-${serviceId}`);
    const toggleSwitch = document.getElementById(`toggle-switch-${serviceId}`);
    
    if (!apiKeyInput || !endpointInput) {
        console.error('无法获取配置信息，请刷新页面重试');
        return;
    }
    
    let apiKey = apiKeyInput.value;
    const endpoint = endpointInput.value.trim();
    
    // 获取启用状态（从本地状态或UI状态）
    const enabled = localModelEnabledState[serviceId] !== undefined 
        ? localModelEnabledState[serviceId] 
        : (toggleSwitch && toggleSwitch.classList.contains('active'));
    
    // 如果API Key显示为***，使用原始值（从data-original-value属性获取）
    if (apiKey === '***' || apiKey === '') {
        const originalValue = apiKeyInput.getAttribute('data-original-value') || '';
        apiKey = originalValue;
    }
    
    // 如果启用了，验证Endpoint（但允许保存，因为可能只是切换启用状态）
    // 注释掉这个验证，允许先启用再配置Endpoint
    // if (enabled && !endpoint) {
    //     console.warn('启用模型服务时，请填写API Endpoint');
    //     return;
    // }
    
    try {
        const response = await fetch(`/api/settings/ai-models/${serviceId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            credentials: 'include',
            body: JSON.stringify({
                enabled: enabled,  // 保存当前的启用状态
                config: {
                    api_key: apiKey || '',
                    endpoint: endpoint || getDefaultEndpoint(serviceId)
                }
            })
        });
        
        const result = await response.json();
        if (response.ok && result.success) {
            // 更新本地modelMap
            if (!modelMap[serviceId]) {
                modelMap[serviceId] = {};
            }
            modelMap[serviceId].enabled = enabled;
            if (!modelMap[serviceId].config) {
                modelMap[serviceId].config = {};
            }
            modelMap[serviceId].config.api_key = apiKey;
            modelMap[serviceId].config.endpoint = endpoint;
            
            // 清除本地状态
            delete localModelEnabledState[serviceId];
            
            // 显示保存成功提示（仅在启用状态变化时显示）
            if (oldEnabled !== null && oldEnabled !== enabled) {
                console.log(`✅ 配置已保存: ${serviceId} 启用状态=${enabled}`);
            }
        } else {
            console.error('保存失败:', result);
            // 如果保存失败，恢复UI状态
            if (oldEnabled !== null && toggleSwitch) {
                if (oldEnabled) {
                    toggleSwitch.classList.add('active');
                } else {
                    toggleSwitch.classList.remove('active');
                }
                updateFormEnabledState(serviceId, oldEnabled);
                localModelEnabledState[serviceId] = oldEnabled;
            }
            alert(`保存失败: ${result.error || '未知错误'}`);
        }
    } catch (error) {
        console.error('保存失败:', error);
        // 如果保存失败，恢复UI状态
        if (oldEnabled !== null && toggleSwitch) {
            if (oldEnabled) {
                toggleSwitch.classList.add('active');
            } else {
                toggleSwitch.classList.remove('active');
            }
            updateFormEnabledState(serviceId, oldEnabled);
            localModelEnabledState[serviceId] = oldEnabled;
        }
        alert(`保存失败: ${error.message || '网络错误'}`);
    }
}

async function testEmail(providerId) {
    const testBtn = document.getElementById(`test-email-${providerId}`);
    if (testBtn) {
        testBtn.disabled = true;
        testBtn.textContent = '发送中...';
    }
    
    // 获取当前用户邮箱作为测试收件人
    const recipientEmail = prompt('请输入测试邮件接收邮箱:', current_user?.email || '');
    if (!recipientEmail) {
        if (testBtn) {
            testBtn.disabled = false;
            testBtn.textContent = '发送测试邮件';
        }
        return;
    }
    
    try {
        const response = await fetch('/api/settings/email/test', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            credentials: 'include',
            body: JSON.stringify({
                provider: providerId,
                recipient: recipientEmail
            })
        });
        
        const result = await response.json();
        
        if (result.success) {
            alert('测试邮件发送成功！请查收邮箱。');
        } else {
            alert('发送失败: ' + (result.error || '未知错误'));
        }
    } catch (error) {
        console.error('发送测试邮件失败:', error);
        alert('发送测试邮件失败，请重试');
    } finally {
        if (testBtn) {
            testBtn.disabled = false;
            testBtn.textContent = '发送测试邮件';
        }
    }
}

            {id: 'qwen-turbo', name: 'qwen-turbo', context: '8K'},
            {id: 'qwen-plus', name: 'qwen-plus', context: '32K'},
            {id: 'qwen-max', name: 'qwen-max', context: '8K'}
        ],
        'openai': [
            {id: 'gpt-4o', name: 'gpt-4o', context: '128K'},
            {id: 'gpt-4-turbo', name: 'gpt-4-turbo', context: '128K'},
            {id: 'gpt-3.5-turbo', name: 'gpt-3.5-turbo', context: '16K'}
        ]
    };
    return defaults[serviceId] || [];
}

function renderModelList(serviceId, models) {
    const listDiv = document.getElementById(`model-list-${serviceId}`);
    if (!listDiv) return;
    
    // 只显示已添加的模型
    const addedModels = models ? models.filter(m => m.added !== false) : [];
    
    if (!addedModels || addedModels.length === 0) {
        listDiv.innerHTML = '<p style="color: var(--muted); font-size: 12px;">暂无已添加的模型，请点击"管理模型"添加</p>';
        return;
    }
    
    listDiv.innerHTML = addedModels.map((model, index) => `
        <div style="padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
            <div style="width: 20px; color: var(--muted);">::</div>
            <div style="flex: 1;">
                <div style="font-weight: 500; font-size: 14px;">${model.name || model.id}</div>
                <div style="font-size: 12px; color: var(--muted);">${model.id} ${model.context ? `· ${model.context}` : ''}</div>
            </div>
        </div>
    `).join('');
}

// 显示模型选择对话框（检查连通性）
function showModelSelectDialog(serviceId) {
    const models = modelListCache[serviceId] || getDefaultModels(serviceId);
    
    const modal = document.createElement('div');
    modal.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;';
    modal.innerHTML = `
        <div style="background: white; border-radius: 12px; padding: 24px; width: 90%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="margin: 0; font-size: 18px; font-weight: 600;">检查连通性</h3>
                <div style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted);" onclick="this.closest('[style*=\"position: fixed\"]').remove()">✕</div>
            </div>
            <div style="margin-bottom: 20px;">
                <div style="font-size: 14px; color: var(--muted); margin-bottom: 8px;">选择要检测的模型</div>
                <select class="form-input" id="test-model-select" style="width: 100%;">
                    ${models.map(m => `<option value="${m.id}">${m.name || m.id}</option>`).join('')}
                </select>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 12px;">
                <button class="button secondary" onclick="this.closest('[style*=\"position: fixed\"]').remove()">取消</button>
                <button class="button primary" onclick="testSelectedModel('${serviceId}')">确定</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
}

async function testSelectedModel(serviceId) {
    const select = document.getElementById('test-model-select');
    if (!select) return;
    
    const modelId = select.value;
    const modal = select.closest('[style*="position: fixed"]');
    
    try {
        const response = await fetch(`/api/settings/ai-models/${serviceId}/test-model`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            credentials: 'include',
            body: JSON.stringify({model_id: modelId})
        });
        
        const result = await response.json();
        modal.remove();
        
        if (result.success && result.data && result.data.connected) {
            alert(`模型 ${modelId} 连接成功！响应时间: ${result.data.response_time}ms`);
        } else {
            alert(`模型 ${modelId} 连接失败: ${result.data?.message || result.error || '未知错误'}`);
        }
    } catch (error) {
        modal.remove();
        alert('测试失败，请重试');
    }
}

// 管理模型
async function manageModels(serviceId) {
    // 显示模型管理对话框
    const modal = document.createElement('div');
    modal.className = 'model-manage-modal';
    modal.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;';
    modal.innerHTML = `
        <div style="background: white; border-radius: 12px; padding: 24px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.2);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="margin: 0; font-size: 18px; font-weight: 600;">模型管理</h3>
                <div style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted);" onclick="this.closest('.model-manage-modal').remove()">✕</div>
            </div>
            <div id="manage-model-list" style="margin-bottom: 20px; min-height: 200px;"></div>
            <div style="display: flex; justify-content: space-between; gap: 12px;">
                <button class="button secondary" onclick="fetchModelList('${serviceId}')" id="fetch-models-btn-${serviceId}">
                    <span style="margin-right: 6px;">🔄</span>获取模型列表
                </button>
                <div style="display: flex; gap: 12px;">
                    <button class="button secondary" onclick="this.closest('.model-manage-modal').remove()">关闭</button>
                </div>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
    
    // 自动获取逻辑：
    // 1）如果当前服务在缓存中的模型列表为空（从未获取过），则自动调用一次获取；
    // 2）如果已经有缓存（非空），则直接渲染缓存，让用户手动点击“获取模型列表”来刷新。
    const cachedModels = modelListCache[serviceId];
    const listDiv = document.getElementById('manage-model-list');
    
    if (!cachedModels || cachedModels.length === 0) {
        // 从未获取过，自动获取一次
        if (listDiv) {
            listDiv.innerHTML = '<p style="color: var(--muted); text-align: center; padding: 20px;">正在获取模型列表...</p>';
        }
        await fetchModelList(serviceId);
    } else {
        // 已有缓存，直接渲染缓存，保留“获取模型列表”按钮供手动刷新
        if (listDiv) {
            listDiv.innerHTML = renderModelListHTML(cachedModels, serviceId);
        }
    }
}

async function fetchModelList(serviceId) {
    const fetchBtn = document.getElementById(`fetch-models-btn-${serviceId}`);
    const listDiv = document.getElementById('manage-model-list');
    
    if (!listDiv) return;
    
    if (fetchBtn) {
        fetchBtn.disabled = true;
        fetchBtn.innerHTML = '<span style="margin-right: 6px;">⏳</span>获取中...';
    }
    
    listDiv.innerHTML = '<p style="color: var(--muted); text-align: center; padding: 20px;">正在获取模型列表...</p>';
    
    try {
        const response = await fetch(`/api/settings/ai-models/${serviceId}/models`, {
            method: 'GET',
            credentials: 'include'
        });
        
        const result = await response.json();
        
        if (result.success && result.data && result.data.models && result.data.models.length > 0) {
            const fetchedModels = result.data.models;
            const oldCache = modelListCache[serviceId] || [];
            
            // 按最新远端列表为准：只保留这次获取到的模型，
            // 对于已存在于缓存中的模型，保留其 added / vision / tools 等平台状态；
            const merged = fetchedModels.map(m => {
                const old = oldCache.find(o => o.id === m.id);
                if (old) {
                    return {
                        ...m,
                        // 保留平台侧状态（是否已加入平台、视觉/工具能力等）
                        added: old.added,
                        vision: old.vision,
                        tools: old.tools,
                        context: m.context || old.context
                    };
                }
                // 新识别的模型：默认未加入平台（added 不设或为 false）
                return {
                    ...m,
                    added: false
                };
            });
            
            modelListCache[serviceId] = merged;
            listDiv.innerHTML = renderModelListHTML(merged, serviceId);
            
            // 同时更新配置页面的模型列表
            const configListDiv = document.getElementById(`model-list-${serviceId}`);
            if (configListDiv) {
                renderModelList(serviceId, merged);
            }
            
            if (fetchBtn) {
                fetchBtn.disabled = false;
                fetchBtn.innerHTML = '<span style="margin-right: 6px;">🔄</span>刷新列表';
            }
        } else {
            // 如果没有获取到模型，使用默认模型列表
            const defaultModels = getDefaultModels(serviceId);
            modelListCache[serviceId] = defaultModels;
            listDiv.innerHTML = renderModelListHTML(defaultModels, serviceId);
            
            if (fetchBtn) {
                fetchBtn.disabled = false;
                fetchBtn.innerHTML = '<span style="margin-right: 6px;">🔄</span>获取模型列表';
            }
        }
    } catch (error) {
        console.error('获取模型列表失败:', error);
        listDiv.innerHTML = '<p style="color: #dc2626; text-align: center; padding: 20px;">获取模型列表失败，请检查配置后重试</p>';
        
        if (fetchBtn) {
            fetchBtn.disabled = false;
            fetchBtn.innerHTML = '<span style="margin-right: 6px;">🔄</span>重试';
        }
    }
}

function renderModelListHTML(models, serviceId) {
    if (!models || models.length === 0) {
        return '<p style="color: var(--muted); text-align: center; padding: 20px;">暂无模型</p>';
    }
    return models.map((model, index) => {
        const isAdded = modelListCache[serviceId] && modelListCache[serviceId].some(m => m.id === model.id && m.added);
        return `
        <div style="padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
            <div style="width: 20px; color: var(--muted);">::</div>
            <div style="flex: 1;">
                <div style="font-weight: 500; font-size: 14px;">${model.name || model.id}</div>
                <div style="font-size: 12px; color: var(--muted);">${model.id} ${model.context ? `· ${model.context}` : ''}</div>
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
                ${isAdded ? `
                    <div style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); border: 1px solid var(--border); border-radius: 4px;" onclick="removeModel('${serviceId}', '${model.id}')" title="移除">−</div>
                ` : `
                    <div style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; background: var(--primary); border-radius: 4px;" onclick="addModel('${serviceId}', '${model.id}', '${(model.name || model.id).replace(/'/g, "\\'")}', '${model.context || ''}')" title="添加">+</div>
                `}
            </div>
        </div>
    `;
    }).join('');
}

// 显示添加/编辑自定义模型对话框
function showAddCustomModelDialog(serviceId, isEdit = false, modelId = null) {
    const model = isEdit && modelId ? (modelListCache[serviceId] || []).find(m => m.id === modelId) : null;
    
    const modal = document.createElement('div');
    modal.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;';
    modal.innerHTML = `
        <div style="background: white; border-radius: 12px; padding: 24px; width: 90%; max-width: 500px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="margin: 0; font-size: 18px; font-weight: 600;">${isEdit ? '修改自定义模型' : '添加自定义模型'}</h3>
                <div style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted);" onclick="this.closest('[style*=\"position: fixed\"]').remove()">✕</div>
            </div>
            <div class="grid" style="gap: 16px;">
                <div>
                    <div style="font-size: 14px; color: var(--muted); margin-bottom: 6px;">模型 ID <span style="color: #dc2626;">*</span></div>
                    <input type="text" class="form-input" id="custom-model-id" value="${model ? model.id : ''}" placeholder="例如: deepseek-r1:32b" ${isEdit ? 'readonly' : ''}>
                </div>
                <div>
                    <div style="font-size: 14px; color: var(--muted); margin-bottom: 6px;">模型显示名称 <span style="color: #dc2626;">*</span></div>
                    <input type="text" class="form-input" id="custom-model-name" value="${model ? (model.name || model.id) : ''}" placeholder="例如: DeepSeek R1 32B">
                </div>
                <div>
                    <div style="font-size: 14px; color: var(--muted); margin-bottom: 6px;">最大 Token 数 <span style="color: #dc2626;">*</span></div>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <input type="number" class="form-input" id="custom-model-tokens" value="${model ? (parseInt(model.context) || 32) : '32'}" placeholder="32" style="flex: 1;">
                        <div style="padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-size: 14px;">K</div>
                    </div>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; border-radius: 10px; border: 1px solid var(--border);">
                    <div>
                        <div style="font-size: 14px; font-weight: 500; margin-bottom: 4px;">支持视觉识别</div>
                        <div style="font-size: 12px; color: var(--muted);">是否支持图像输入</div>
                    </div>
                    <div class="toggle-switch ${model && model.vision ? 'active' : ''}" onclick="toggleCustomModelOption('vision')" id="toggle-vision"></div>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; border-radius: 10px; border: 1px solid var(--border);">
                    <div>
                        <div style="font-size: 14px; font-weight: 500; margin-bottom: 4px;">支持工具调用</div>
                        <div style="font-size: 12px; color: var(--muted);">是否支持Function Calling</div>
                    </div>
                    <div class="toggle-switch ${model && model.tools ? 'active' : ''}" onclick="toggleCustomModelOption('tools')" id="toggle-tools"></div>
                </div>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px;">
                <button class="button secondary" onclick="this.closest('[style*=\"position: fixed\"]').remove()">取消</button>
                <button class="button primary" onclick="saveCustomModel('${serviceId}', ${isEdit}, '${modelId || ''}')">保存</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
}

function toggleCustomModelOption(type) {
    const toggle = document.getElementById(`toggle-${type}`);
    if (toggle) {
        toggle.classList.toggle('active');
    }
}

async function saveCustomModel(serviceId, isEdit, modelId) {
    const modelIdInput = document.getElementById('custom-model-id');
    const modelNameInput = document.getElementById('custom-model-name');
    const modelTokensInput = document.getElementById('custom-model-tokens');
    const visionToggle = document.getElementById('toggle-vision');
    const toolsToggle = document.getElementById('toggle-tools');
    
    if (!modelIdInput || !modelNameInput || !modelTokensInput) {
        alert('请填写所有必填字段');
        return;
    }
    
    const modelData = {
        id: modelIdInput.value.trim(),
        name: modelNameInput.value.trim(),
        context: `${modelTokensInput.value}K`,
        vision: visionToggle && visionToggle.classList.contains('active'),
        tools: toolsToggle && toolsToggle.classList.contains('active')
    };
    
    if (!modelData.id || !modelData.name) {
        alert('请填写模型ID和显示名称');
        return;
    }
    
    try {
        // 更新本地缓存
        if (!modelListCache[serviceId]) {
            modelListCache[serviceId] = [];
        }
        
        if (isEdit) {
            const index = modelListCache[serviceId].findIndex(m => m.id === modelId);
            if (index >= 0) {
                modelListCache[serviceId][index] = modelData;
            }
        } else {
            modelListCache[serviceId].push(modelData);
        }
        
        // 重新渲染模型列表
        const listDiv = document.getElementById(`model-list-${serviceId}`);
        if (listDiv) {
            renderModelList(serviceId, modelListCache[serviceId]);
        }
        
        // 关闭对话框
        const modal = modelIdInput.closest('[style*="position: fixed"]');
        if (modal) {
            modal.remove();
        }
        
        alert(isEdit ? '模型已更新' : '模型已添加');
    } catch (error) {
        console.error('保存模型失败:', error);
        alert('保存失败，请重试');
    }
}

function editCustomModel(serviceId, modelId) {
    showAddCustomModelDialog(serviceId, true, modelId);
}

function toggleModelVisibility(serviceId, modelId) {
    // TODO: 实现模型可见性切换
    console.log('Toggle model visibility:', serviceId, modelId);
}

function addModel(serviceId, modelId, modelName, context) {
    if (!modelListCache[serviceId]) {
        modelListCache[serviceId] = [];
    }
    
    // 检查是否已存在
    if (modelListCache[serviceId].some(m => m.id === modelId && m.added)) {
        alert('模型已添加');
        return;
    }
    
    // 添加模型
    const model = {
        id: modelId,
        name: modelName,
        context: context,
        added: true
    };
    
    modelListCache[serviceId].push(model);
    
    // 更新显示
    const listDiv = document.getElementById('manage-model-list');
    if (listDiv) {
        // 重新获取模型列表以更新显示
        fetchModelList(serviceId);
    }
    
    // 更新配置页面的模型列表
    const configListDiv = document.getElementById(`model-list-${serviceId}`);
    if (configListDiv) {
        renderModelList(serviceId, modelListCache[serviceId].filter(m => m.added));
    }
}

function removeModel(serviceId, modelId) {
    if (!confirm(`确定要移除模型 ${modelId} 吗？`)) {
        return;
    }
    
    if (modelListCache[serviceId]) {
        // 移除added标记
        const model = modelListCache[serviceId].find(m => m.id === modelId);
        if (model) {
            model.added = false;
        }
        
        // 更新显示
        const listDiv = document.getElementById('manage-model-list');
        if (listDiv) {
            fetchModelList(serviceId);
        }
        
        // 更新配置页面的模型列表
        const configListDiv = document.getElementById(`model-list-${serviceId}`);
        if (configListDiv) {
            renderModelList(serviceId, modelListCache[serviceId].filter(m => m.added));
        }
    }
}

function deleteModel(serviceId, modelId) {
    if (!confirm(`确定要删除模型 ${modelId} 吗？`)) {
        return;
    }
    
    if (modelListCache[serviceId]) {
        modelListCache[serviceId] = modelListCache[serviceId].filter(m => m.id !== modelId);
        renderModelList(serviceId, modelListCache[serviceId].filter(m => m.added));
    }
}

// 重写renderModelDetail以在渲染后加载模型列表
const originalRenderModelDetail = renderModelDetail;
renderModelDetail = function(serviceId, model) {
    const html = originalRenderModelDetail(serviceId, model);
    // 延迟加载模型列表，确保DOM已渲染
    setTimeout(() => {
        loadModelList(serviceId);
    }, 100);
    return html;
};

// 初始化加载第一个tab
document.addEventListener('DOMContentLoaded', function() {
    loadTabContent('model');
});
