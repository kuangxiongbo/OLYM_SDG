<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSRF token removed - not using Flask-WTF -->
    <title>{% block title %}SDG Web界面{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Art Deco CSS -->
    <link href="{{ url_for('static', filename='css/artdeco.css') }}" rel="stylesheet">
    <!-- 自定义CSS -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="fas fa-database"></i> SDG
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">
                            <i class="fas fa-home"></i> 首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'data_sources' %}active{% endif %}" href="{{ url_for('data_sources') }}">
                            <i class="fas fa-database"></i> 数据源
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'model_configs' %}active{% endif %}" href="{{ url_for('model_configs') }}">
                            <i class="fas fa-cogs"></i> 模型配置
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'synthetic_data' %}active{% endif %}" href="{{ url_for('synthetic_data') }}">
                            <i class="fas fa-chart-bar"></i> 结果展示
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'sensitive_detection' %}active{% endif %}" href="{{ url_for('sensitive_detection') }}">
                            <i class="fas fa-tasks"></i> 批量处理
                        </a>
                    </li>
                </ul>
                
                <!-- 用户认证相关导航 -->
                <ul class="navbar-nav">
                    <li class="nav-item dropdown" id="authDropdown" style="display: none;">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user"></i> <span id="usernameDisplay"></span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="{{ url_for('profile') }}">
                                <i class="fas fa-user-cog"></i> 个人资料
                            </a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">
                                <i class="fas fa-sign-out-alt"></i> 退出登录
                            </a></li>
                        </ul>
                    </li>
                    <li class="nav-item" id="loginButton">
                        <a class="nav-link" href="/auth/login">
                            <i class="fas fa-sign-in-alt"></i> 登录
                        </a>
                    </li>
                    <li class="nav-item" id="registerButton">
                        <a class="nav-link" href="/auth/register">
                            <i class="fas fa-user-plus"></i> 注册
                        </a>
                    </li>
                </ul>
                
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main>
        <!-- 消息提示 -->
        <div id="alert-container"></div>
        
        {% block content %}{% endblock %}
    </main>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- SheetJS for Excel parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- 自定义JS -->
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    
    <!-- 认证状态检查 -->
    <script>
        // 检查用户登录状态
        async function checkAuthStatus() {
            try {
                const response = await fetch('/auth/check-auth');
                
                // 检查响应状态
                if (!response.ok) {
                    console.warn('认证状态检查失败，状态码:', response.status);
                    updateUIForGuestUser();
                    return;
                }
                
                // 检查响应内容类型
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    console.warn('认证状态API返回非JSON响应:', contentType);
                    updateUIForGuestUser();
                    return;
                }
                
                const result = await response.json();
                
                if (result.success && result.authenticated) {
                    // 用户已登录
                    document.getElementById('authDropdown').style.display = 'block';
                    document.getElementById('loginButton').style.display = 'none';
                    document.getElementById('registerButton').style.display = 'none';
                    document.getElementById('usernameDisplay').textContent = result.user.username;
                } else {
                    // 用户未登录
                    document.getElementById('authDropdown').style.display = 'none';
                    document.getElementById('loginButton').style.display = 'block';
                    document.getElementById('registerButton').style.display = 'block';
                }
            } catch (error) {
                console.error('检查认证状态失败:', error);
                // 默认显示访客状态
                document.getElementById('authDropdown').style.display = 'none';
                document.getElementById('loginButton').style.display = 'block';
                document.getElementById('registerButton').style.display = 'block';
            }
        }
        
        // 更新访客用户UI
        function updateUIForGuestUser() {
            document.getElementById('authDropdown').style.display = 'none';
            document.getElementById('loginButton').style.display = 'block';
            document.getElementById('registerButton').style.display = 'block';
        }
        
        // 退出登录
        async function logout() {
            if (confirm('确定要退出登录吗？')) {
                try {
                    const response = await fetch('/auth/logout', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        }
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        // 刷新页面以更新导航栏
                        window.location.reload();
                    } else {
                        alert('退出登录失败');
                    }
                } catch (error) {
                    console.error('退出登录失败:', error);
                    alert('退出登录失败，请稍后重试');
                }
            }
        }
        
        // 页面加载时检查认证状态
        document.addEventListener('DOMContentLoaded', function() {
            checkAuthStatus();
        });
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
